function closingText(j){
  const n = daysUntil(j.closes);
  if (n < 0) return 'Closed';
  if (n === 0) return 'Closes today';
  if (n === 1) return 'Closes tomorrow';
  if (n <= 7) return `Closes in ${n} days`;
  return `Closes ${fmt(j.closes)}`;
}
function matchScore(j, i = intern(DEMO_PEOPLE.intern)){
  const sk = j.skills.filter(s => S.cv.skills.map(x => x.toLowerCase()).includes(s.toLowerCase())).length;
  let score = 40 + Math.round(40 * sk / Math.max(1, j.skills.length));
  if ((i.sectors || []).includes(j.sector)) score += 12;
  if (j.area === i.area) score += 8;
  return Math.min(98, score);
}

    const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))).toLocaleString('en-GB'); if (k < 1) requestAnimationFrame(step); };
    el.textContent = '0'; requestAnimationFrame(step);
  });
  $$('.meter i').forEach(el => { const w = el.style.width; el.style.width = '0'; requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = w; })); });
});
function confetti(){
  if (reducedMotion()) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const cols = ['#2E3BFF','#F7A8EE','#B6E33A','#FFB547','#5A4BF2','#1FA463'];
  const P = Array.from({length:140}, () => ({x:innerWidth / 2 + (Math.random() - .5) * 160, y:innerHeight * .35, vx:(Math.random() - .5) * 13, vy:-Math.random() * 12 - 4, s:Math.random() * 7 + 4, r:Math.random() * 6, vr:(Math.random() - .5) * .3, c:cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now();
  const tick = t => {
    x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (t - t0 < 2200) requestAnimationFrame(tick); else c.remove();
  };
  requestAnimationFrame(tick);
}

];
let tourI = -1, tourEl = null, tourRAF = 0, tourKey = '', tourStill = 0, tourLastTop = null, tourT0 = 0;
/* While the tour runs the page is locked: no wheel, touch, keyboard or scrollbar scrolling.
   Only the tour itself scrolls, and the spotlight is redrawn every frame so it always sits on the right thing. */
ACT.tour = () => { closeModal(); closePop && closePop(); tourI = 0; document.documentElement.classList.add('tour-lock'); tourShell(); tourStep(); };
function tourShell(){
  if ($('#tour')) return;
  const t = document.createElement('div'); t.id = 'tour'; t.className = 'moving';
  t.innerHTML = `<div class="tour-hole"></div><div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-t"></div>`;
  ['wheel', 'touchmove'].forEach(ev => t.addEventListener(ev, e => e.preventDefault(), {passive:false}));
  document.body.appendChild(t);
  cancelAnimationFrame(tourRAF); tourRAF = requestAnimationFrame(tourFrame);
}
function tourStep(){
  const s = TOUR[tourI], t = $('#tour');
  t.classList.add('moving'); tourEl = null; tourKey = ''; tourStill = 0; tourLastTop = null; tourT0 = 0;
  const card = $('.tour-card', t);
  card.innerHTML = `<div class="small muted">Step ${tourI + 1} of ${TOUR.length}</div><h2 id="tour-t">${esc(s.t)}</h2><p>${esc(s.b)}</p>
    <div class="tour-dots" aria-hidden="true">${TOUR.map((_, i) => `<i class="${i === tourI ? 'on' : ''}"></i>`).join('')}</div>
    <div class="tour-btns"><button class="btn btn-quiet btn-sm" data-act="tour-end">End tour</button><span>${tourI ? '<button class="btn btn-ghost btn-sm" data-act="tour-back">Back</button>' : ''} <button class="btn btn-primary btn-sm" data-act="tour-next">${tourI === TOUR.length - 1 ? 'Finish' : 'Next'}</button></span></div>`;
  const here = location.hash === s.r || (s.r === '#/' && (location.hash === '' || location.hash === '#/'));
  const step = tourI;
  const find = (t0 = performance.now()) => {
    if (step !== tourI) return;
    const el = $(s.sel);
    if (el && el.getBoundingClientRect().height > 0){ tourEl = el; tourScroll(); return; }
    if (performance.now() - t0 > 2500){ tourEl = null; tourT0 = performance.now(); return; }
    setTimeout(() => find(t0), 40);
  };
  if (here) requestAnimationFrame(() => find());
  else { window.addEventListener('hashchange', () => requestAnimationFrame(() => find()), {once:true}); location.hash = s.r; }
}
/* Height of anything stuck to the top of the screen (demo bar, mobile menu), so the spotlight never sits under it */
function tourSafeTop(){
  let y = 0;
  $$('.demobar,.mobnav').forEach(b => { const cs = getComputedStyle(b); if (cs.display !== 'none' && (cs.position === 'sticky' || cs.position === 'fixed')) y = Math.max(y, (parseFloat(cs.top) || 0) + b.offsetHeight); });
  return y;
}
function tourScroll(){
  const card = $('.tour-card'), ch = card.offsetHeight, pad = 8, gap = 14, H = innerHeight, safe = tourSafeTop() + 12;
  const r = tourEl.getBoundingClientRect(), block = r.height + pad * 2 + gap + ch;
  const want = block <= H - safe - 12 ? safe + Math.max(0, (H - safe - 12 - block) / 2) + pad : safe + pad;
  const max = document.documentElement.scrollHeight - H;
  window.scrollTo({top:Math.max(0, Math.min(max, scrollY + r.top - want)), behavior:reducedMotion() ? 'instant' : 'smooth'});
  tourT0 = performance.now();
}
function tourFrame(){
  if (tourI < 0) return;
  tourRAF = requestAnimationFrame(tourFrame);
  const t = $('#tour'); if (!t) return;
  const hole = $('.tour-hole', t), card = $('.tour-card', t);
  if (tourEl && !tourEl.isConnected){ const el = $(TOUR[tourI].sel); tourEl = el || null; }
  const W = innerWidth, H = innerHeight, pad = 8, gap = 14, cw = card.offsetWidth, ch = card.offsetHeight, safe = tourSafeTop() + 6;
  let top, bottom, left, right, cardTop;
  if (tourEl){
    const r = tourEl.getBoundingClientRect();
    top = r.top - pad; bottom = r.bottom + pad; left = Math.max(6, r.left - pad); right = Math.min(W - 6, r.right + pad);
    if (bottom + gap + ch <= H - 12) cardTop = bottom + gap;
    else if (top - gap - ch >= safe) cardTop = top - gap - ch;
    else { cardTop = H - ch - 12; bottom = Math.min(bottom, cardTop - gap); }
    top = Math.max(safe, top);
    if (bottom - top < 24) bottom = top + 24;
    /* fade in only once scrolling and page animations have settled */
    if (t.classList.contains('moving')){
      tourStill = (tourLastTop !== null && Math.abs(r.top - tourLastTop) < 0.5) ? tourStill + 1 : 0;
      tourLastTop = r.top;
      if (tourStill >= 4 || performance.now() - tourT0 > 1400){ t.classList.remove('moving'); $('[data-act=tour-next]', t)?.focus({preventScroll:true}); }
    }
  } else {
    /* nothing to point at: centre the card with no spotlight */
    top = bottom = H / 2; left = right = W / 2; cardTop = (H - ch) / 2;
    if (t.classList.contains('moving') && performance.now() - tourT0 > 300 && tourT0){ t.classList.remove('moving'); $('[data-act=tour-next]', t)?.focus({preventScroll:true}); }
  }
  const cl = Math.max(12, Math.min(W - cw - 12, left));
  const key = [top, left, right, bottom, cardTop, cl].map(Math.round).join(',');
  if (key === tourKey) return;
  tourKey = key;
  Object.assign(hole.style, {top:top + 'px', left:left + 'px', width:(right - left) + 'px', height:(bottom - top) + 'px'});
  Object.assign(card.style, {top:cardTop + 'px', left:cl + 'px'});
  hole.classList.toggle('none', !tourEl);
}
ACT['tour-next'] = () => { if (tourI === TOUR.length - 1){ ACT['tour-end'](); toast('Tour finished. Explore any view from the bar at the top.'); return; } tourI++; tourStep(); };
ACT['tour-back'] = () => { tourI = Math.max(0, tourI - 1); tourStep(); };
ACT['tour-end'] = () => { tourI = -1; tourEl = null; cancelAnimationFrame(tourRAF); $('#tour') && $('#tour').remove(); document.documentElement.classList.remove('tour-lock'); };
document.addEventListener('keydown', e => {
  if (tourI < 0) return;
  if (e.key === 'Escape'){ ACT['tour-end'](); return; }
  if (e.key === 'Tab'){ /* keep focus inside the tour card */
    const f = $$('#tour .tour-card button'); if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus({preventScroll:true});
    return;
  }
  const scrollKeys = ['ArrowUp','ArrowDown','PageUp','PageDown','Home','End'];
  if (scrollKeys.includes(e.key) || (e.key === ' ' && !e.target.closest('button'))) e.preventDefault();
});

/* ---------- Jobs board (shared) ---------- */
function filteredJobs(){
  const F = S.filters;
  const q = F.q.toLowerCase();
  let list = liveJobs().filter(j => {
    const e = emp(j.emp);
    if (q && !(j.title + ' ' + e.name + ' ' + j.skills.join(' ') + ' ' + sectorName(j.sector) + ' ' + j.summary).toLowerCase().includes(q)) return false;
    if (F.area && j.area !== F.area) return false;
    if (F.sectors.size && !F.sectors.has(j.sector)) return false;
    if (F.modes.size && !F.modes.has(j.mode)) return false;
    if (F.programme && j.programme !== F.programme) return false;
    if (F.minPay && j.pay < 13) return false;
    return true;
  });
  const sorts = {
    newest:(a,b) => d(b.posted) - d(a.posted),
    closing:(a,b) => d(a.closes) - d(b.closes),
    pay:(a,b) => b.pay - a.pay,
    match:(a,b) => matchScore(b) - matchScore(a)
  };
  return list.sort(sorts[F.sort] || sorts.newest);
}

      </fieldset>

function jobResults(base){

/* ---------- Region map (simplified) ---------- */
const TOWNS = {
  'Peterborough':[52.5695,-0.2405],'Wisbech':[52.666,0.159],'March':[52.551,0.088],'Huntingdon':[52.331,-0.186],
  'St Ives':[52.333,-0.075],'St Neots':[52.229,-0.27],'Ely':[52.399,0.262],'Cambridge':[52.205,0.1218],
  'Northstowe':[52.283,0.045],'Alconbury Weald':[52.372,-0.236]
};
const OUTLINE = [[52.66,-0.42],[52.70,-0.22],[52.69,-0.02],[52.74,0.10],[52.75,0.18],[52.70,0.27],[52.56,0.31],[52.50,0.44],[52.42,0.52],[52.30,0.48],[52.22,0.43],[52.12,0.34],[52.05,0.15],[52.08,-0.05],[52.15,-0.19],[52.20,-0.33],[52.32,-0.46],[52.45,-0.41],[52.55,-0.48]];
const LABEL_POS = {'Peterborough':['l',0],'March':['r',0],'Wisbech':['l',0],'Ely':['r',0],'Huntingdon':['l',8],'St Ives':['r',-10],'Alconbury Weald':['l',-6],'St Neots':['l',0],'Northstowe':['r',0],'Cambridge':['r',0]};
const RIVERS = [
  [[52.21,-0.30],[52.23,-0.27],[52.30,-0.22],[52.33,-0.18],[52.33,-0.07],[52.34,0.04],[52.38,0.20],[52.40,0.26],[52.47,0.30],[52.56,0.34],[52.62,0.38]],
  [[52.55,-0.42],[52.57,-0.24],[52.59,-0.10],[52.62,0.05],[52.66,0.16],[52.73,0.19]],
  [[52.17,0.08],[52.21,0.13],[52.27,0.19],[52.33,0.22],[52.36,0.24]]
];
const CALLOUT = {'Peterborough':['l',-16,-62],'Wisbech':['r',16,-44],'March':['r',18,-16],'Ely':['r',18,-44],'Alconbury Weald':['l',-16,-50],'Huntingdon':['l',-16,6],'St Ives':['r',14,-56],'St Neots':['l',-16,0],'Northstowe':['r',16,-10],'Cambridge':['r',20,-8]};
let mapN = 0;
function regionMap({counts, unit, act, title}){
  const W = 560, H = 620, pad = 30, id = 'm' + (++mapN);
  const lats = OUTLINE.map(p => p[0]), lons = OUTLINE.map(p => p[1]);
  const la0 = Math.min(...lats), la1 = Math.max(...lats), lo0 = Math.min(...lons), lo1 = Math.max(...lons);
  const k = Math.cos(52.4 * Math.PI / 180);
  const s = Math.min((W - pad * 2) / ((lo1 - lo0) * k), (H - pad * 2) / (la1 - la0));
  const offX = (W - (lo1 - lo0) * k * s) / 2, offY = (H - (la1 - la0) * s) / 2;
  const P = ([la, lo]) => [offX + (lo - lo0) * k * s, offY + (la1 - la) * s];
  const poly = OUTLINE.map(P);
  const inside = (x, y) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){ const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  let dots = '';
  for (let y = 12; y < H; y += 12) for (let x = 12 + ((y / 12) % 2) * 6; x < W; x += 12) if (inside(x, y)) dots += `<circle class="dot" cx="${x}" cy="${y}" r="2.4"/>`;
  let n = 0;
  const towns = Object.entries(TOWNS).map(([name, ll]) => {
    const [x, y] = P(ll); const c = counts[name] || 0; const [side, dx, dy] = CALLOUT[name] || ['r', 16, -20];
    if (!c) return `<g class="empty" aria-hidden="true"><circle cx="${x}" cy="${y}" r="3"/><text x="${side === 'r' ? x + 8 : x - 8}" y="${y + 4}" text-anchor="${side === 'r' ? 'start' : 'end'}">${name}</text></g>`;
    const label = `${c} ${unit}${c === 1 ? '' : 's'}`;
    const w = Math.max(name.length * 7.6, label.length * 6.6) + 22, h = 40;
    const bx = side === 'r' ? x + dx : x + dx - w, by = y + dy;
    const ex = side === 'r' ? bx : bx + w, ey = by + h / 2;
    const delay = 150 + (n++) * 90;
    return `<g class="town drop" style="animation-delay:${delay}ms" role="button" tabindex="0" data-act="${act}" data-area="${name}" aria-label="${name}: ${label}">

/* Career Wordle */
function wordleState(){
  if (!S.wordle){ const w = WORDS[dayIndex % WORDS.length]; S.wordle = {answer:w.w, def:w.def, guesses:[], cur:'', done:false, won:false, msg:''}; }
  return S.wordle;
}
function scoreGuess(g, ans){
  const res = Array(5).fill('absent'); const a = ans.split(''); const used = Array(5).fill(false);
  for (let i = 0; i < 5; i++) if (g[i] === a[i]){ res[i] = 'correct'; used[i] = true; }
  for (let i = 0; i < 5; i++){ if (res[i] === 'correct') continue; const k = a.findIndex((c,j) => c === g[i] && !used[j]); if (k > -1){ res[i] = 'present'; used[k] = true; } }
  return res;
}
const WL = {correct:'right letter, right place', present:'in the word, wrong place', absent:'not in the word'};
function wordleBoard(){
  const W = wordleState();
  let rows = '';
  for (let r = 0; r < 6; r++){
    const g = W.guesses[r];
    let tiles = '', sr = '';
    if (g){ const sc = scoreGuess(g, W.answer); tiles = g.split('').map((c,i) => `<div class="tile hex ${sc[i]}">${c}</div>`).join(''); sr = `<span class="sr-only">Guess ${r + 1}: ${g.split('').map((c,i) => `${c} ${WL[sc[i]]}`).join(', ')}.</span>`; }
    else if (r === W.guesses.length && !W.done){ tiles = Array.from({length:5}, (_,i) => `<div class="tile hex ${W.cur[i] ? 'filled' : ''}">${W.cur[i] || ''}</div>`).join(''); }
    else tiles = Array.from({length:5}, () => '<div class="tile hex"></div>').join('');
    rows += `<div class="wrow" aria-hidden="${g ? 'false' : 'true'}">${g ? `<span aria-hidden="true" style="display:contents">${tiles}</span>${sr}` : tiles}</div>`;
  }
  const states = {};
  W.guesses.forEach(g => scoreGuess(g, W.answer).forEach((s,i) => { const c = g[i]; const rank = {correct:3,present:2,absent:1}; if (!states[c] || rank[s] > rank[states[c]]) states[c] = s; }));
  const kb = ['QWERTYUIOP','ASDFGHJKL','+ZXCVBNM-'].map(row => `<div>${row.split('').map(k => k === '+' ? `<button class="wide" data-act="wk" data-k="Enter">Enter</button>` : k === '-' ? `<button class="wide" data-act="wk" data-k="Backspace" aria-label="Delete letter">Delete</button>` : `<button class="${states[k] || ''}" data-act="wk" data-k="${k}" aria-label="${k}${states[k] ? ', ' + WL[states[k]] : ''}">${k}</button>`).join('')}</div>`).join('');
  return `<div class="wordle" role="group" aria-label="Guesses">${rows}</div>
    <p role="status" class="small" style="text-align:center;min-height:1.5em;font-weight:700">${esc(W.msg)}</p>
    ${W.done ? `<div class="panel" style="max-width:520px;margin:0 auto;text-align:center"><h2>${W.won ? 'Nice work' : 'Today\'s word'}: ${W.answer}</h2><p>${esc(W.answer[0] + W.answer.slice(1).toLowerCase())} is ${esc(W.def)}</p><a class="btn btn-primary" href="#/intern/boost">Back to today's games</a></div>` : `<div class="kbd" aria-label="Keyboard">${kb}</div>`}
    <div class="legend" style="margin-top:16px"><span><i style="background:var(--mint)"></i>Right letter, right place</span><span><i style="background:#FFB547"></i>In the word, wrong place</span><span><i style="background:#7C8396"></i>Not in the word</span></div>`;
}
function wordleView(){
  return `<a class="back" href="#/intern/boost">${icon('left')}Daily Career Boost</a><div class="pagehead"><div><h1>Career Wordle</h1><p>Guess the five-letter workplace word. You have six tries. Type on your keyboard or use the keys below.</p></div></div><div id="wordle">${wordleBoard()}</div>`;
}
function wordleKey(k){
  const W = wordleState(); if (W.done) return;
  W.msg = '';
  if (k === 'Enter'){
    if (W.cur.length < 5){ W.msg = 'Enter five letters'; }
    else {
      W.guesses.push(W.cur); W.cur = '';
      if (W.guesses.at(-1) === W.answer){ W.done = true; W.won = true; W.msg = `Solved in ${W.guesses.length} ${W.guesses.length === 1 ? 'try' : 'tries'}`; finishGame('wordle', 30); setTimeout(confetti, 150); }
      else if (W.guesses.length === 6){ W.done = true; W.msg = 'Out of tries. Here is today\'s word.'; finishGame('wordle', 10); }
    }
  } else if (k === 'Backspace'){ W.cur = W.cur.slice(0, -1); }
  else if (/^[A-Z]$/.test(k) && W.cur.length < 5){ W.cur += k; }
  const box = $('#wordle'); if (box) box.innerHTML = wordleBoard();
}
ACT.wk = el => { wordleKey(el.dataset.k); const b = $(`[data-act=wk][data-k="${el.dataset.k}"]`); if (b) b.focus(); };
document.addEventListener('keydown', e => {
  if (!$('#wordle') || $('#modal-root').innerHTML) return;
  if (e.target.matches('input,textarea,select')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter' && e.target.closest('button')) return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (k === 'Enter' || k === 'Backspace' || /^[A-Z]$/.test(k)){ e.preventDefault(); wordleKey(k); }
});

/* ===== Word Hive ===== */
const HIVE = {centre:'A', outer:['P','L','C','I','N','G'], words:['ACING','AGING','ALIGN','ALIGNING','ALPACA','ANGLING','APING','APPAL','APPALLING','CAGING','CALL','CALLING','CANAL','CANNING','CAPPING','CLAN','CLANG','CLANGING','CLAP','CLAPPING','GAIN','GAINING','GALA','GALL','GALLING','GANGLIA','GAPING','GAPPING','LACING','LAGGING','LAIN','LANCING','LAPPING','LILAC','NAAN','NAGGING','NAIL','NAILING','NAPPING','PACING','PAGAN','PAGING','PAIL','PAIN','PALING','PALL','PALLING','PANG','PANIC','PANNING','PAPAL','PLACING','PLAIN','PLAN','PLANING','PLANNING']};
const HIVE_ALL = [HIVE.centre, ...HIVE.outer];
const isPangram = w => HIVE_ALL.every(l => w.includes(l));
const hiveScore = w => (w.length === 4 ? 1 : w.length) + (isPangram(w) ? 7 : 0);
const HIVE_MAX = HIVE.words.reduce((s, w) => s + hiveScore(w), 0);
const HIVE_RANKS = [['Getting started', 0], ['Warming up', .04], ['Good', .1], ['Solid', .18], ['Great', .3], ['Amazing', .45], ['Hive mind', .65]];
function hiveState(){ if (!S.hive) S.hive = {found:[], cur:'', msg:'', order:[0,1,2,3,4,5], done:false, flash:''}; return S.hive; }
const hiveTotal = () => hiveState().found.reduce((s, w) => s + hiveScore(w), 0);
function hiveRank(){
  const f = hiveTotal() / HIVE_MAX; let idx = 0;
  HIVE_RANKS.forEach(([n, t], i) => { if (f >= t) idx = i; });
  const next = HIVE_RANKS.at(idx + 1);
  return {name:HIVE_RANKS.at(idx)[0], idx, toNext:next ? Math.ceil(next[1] * HIVE_MAX) - hiveTotal() : 0, nextName:next ? next[0] : ''};
}
const HEXPOS = [[120,46],[190,86],[190,166],[120,206],[50,166],[50,86]];
function hiveBoard(){
  const H = hiveState(), R = hiveRank();
  const cell = (L, x, y, centre) => `<button class="hcell ${centre ? 'centre' : ''}" style="left:${x - 44}px;top:${y - 40}px" data-act="hkey" data-k="${L}" aria-label="${L}${centre ? ', centre letter' : ''}" ${H.done ? 'disabled' : ''}><span class="hexshape">${L}</span></button>`;
  const typed = H.cur ? H.cur.split('').map(c => `<span class="${c === HIVE.centre ? 'cen' : HIVE_ALL.includes(c) ? '' : 'bad'}">${c}</span>`).join('') : '<span class="ph">Type or tap letters</span>';
  const dots = HIVE_RANKS.map((r, i) => `<i class="${i <= R.idx ? 'on' : ''} ${i === R.idx ? 'now' : ''}" title="${r[0]}"></i>`).join('');
  const found = [...H.found].sort();
  const missed = H.done ? HIVE.words.filter(w => !H.found.includes(w)) : [];
  return `<div class="hive-layout">
    <div class="hive-play">
      <div class="hive-rank"><b>${R.name}</b><div class="rankdots" aria-hidden="true">${dots}</div><span class="small muted">${R.toNext > 0 ? `${R.toNext} points to ${R.nextName}` : 'Top rank reached'}</span></div>
      <div class="hive-input ${H.flash}" aria-live="polite" aria-label="Current word">${typed}</div>
      <div class="hive" role="group" aria-label="Today's letters. The centre letter is ${HIVE.centre}.">
        ${cell(HIVE.centre, 120, 126, true)}${H.order.map((o, i) => cell(HIVE.outer.at(o), HEXPOS.at(i)[0], HEXPOS.at(i)[1], false)).join('')}
      </div>
      ${H.done ? '' : `<div class="hive-ctrls"><button class="btn btn-ghost" data-act="hkey" data-k="Backspace">Delete</button><button class="btn btn-ghost" data-act="hshuf" aria-label="Shuffle the outer letters">${icon('arrowr')}Shuffle</button><button class="btn btn-primary" data-act="hkey" data-k="Enter">Enter</button></div>`}
      <p role="status" class="small hive-msg">${esc(H.msg)}</p>
    </div>
    <section class="panel hive-found" aria-labelledby="hf-h">
      <div class="section-head" style="margin-bottom:8px"><h2 id="hf-h" style="margin:0">You have found ${H.found.length} ${H.found.length === 1 ? 'word' : 'words'}</h2><span class="chip">${hiveTotal()} points</span></div>
      <ul class="wordcols">${found.map(w => `<li class="${isPangram(w) ? 'pan' : ''}">${w[0] + w.slice(1).toLowerCase()}${isPangram(w) ? '<span class="sr-only"> (uses all seven letters)</span>' : ''}</li>`).join('')}</ul>
      ${H.done ? `<h3 style="font-size:1rem;margin-top:16px">Words you missed (${missed.length})</h3><ul class="wordcols missed">${missed.map(w => `<li class="${isPangram(w) ? 'pan' : ''}">${w[0] + w.slice(1).toLowerCase()}</li>`).join('')}</ul>
        <div class="explain" style="margin-top:14px"><b>Today's theme: getting placed.</b> Placing, planning, aligning and gaining were all in there.</div>
        <div class="btnrow" style="margin-top:14px">${backToGames()}${shareBtn('hive')}</div>`
      : `<p class="small muted" style="margin:14px 0 8px">Four-letter words score 1. Longer words score one point per letter. A word using all seven letters scores 7 extra and shows in blue.</p><button class="btn btn-quiet" data-act="hfinish">Finish for today</button>`}
    </section>
  </div>`;
}
function hiveDraw(focusSel){ const b = $('#hivegame'); if (b) b.innerHTML = hiveBoard(); if (focusSel){ const f = $(focusSel); if (f) f.focus(); } }
function hiveKey(k){
  const H = hiveState(); if (H.done) return;
  H.msg = ''; H.flash = '';
  if (k === 'Backspace') H.cur = H.cur.slice(0, -1);
  else if (k === 'Enter'){
    const w = H.cur;
    if (!w) return;
    if (w.length < 4) H.msg = 'Too short. Words need four letters or more.';
    else if (!w.includes(HIVE.centre)) H.msg = `Every word needs the centre letter, ${HIVE.centre}.`;
    else if ([...w].some(c => !HIVE_ALL.includes(c))) H.msg = 'That uses a letter that is not in today\'s hive.';
    else if (H.found.includes(w)) H.msg = 'Already found.';
    else if (!HIVE.words.includes(w)) H.msg = 'Not in today\'s word list.';
    else {
      const before = hiveRank().idx;
      H.found.push(w); const p = hiveScore(w);
      H.msg = isPangram(w) ? `Uses all seven letters! +${p}` : p === 1 ? 'Nice. +1' : `Great word. +${p}`;
      H.flash = isPangram(w) ? 'pangram' : 'good';
      if (hiveRank().idx > before){ H.msg += `. You reached ${hiveRank().name}.`; if (hiveRank().name === 'Hive mind') setTimeout(confetti, 150); }
      H.cur = ''; hiveDraw(); return;
    }
    H.flash = 'shake'; H.cur = '';
  }
  else if (/^[A-Z]$/.test(k) && H.cur.length < 14) H.cur += k;
  hiveDraw();
}
ACT.hkey = el => { const k = el.dataset.k; hiveKey(k); hiveDraw(`[data-act=hkey][data-k="${k}"]`); };
ACT.hshuf = () => { const H = hiveState(); for (let i = H.order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [H.order[i], H.order[j]] = [H.order[j], H.order[i]]; } hiveDraw('[data-act=hshuf]'); };
ACT.hfinish = () => { const H = hiveState(); H.done = true; H.cur = ''; const R = hiveRank(); finishGame('hive', Math.min(50, 10 + R.idx * 7)); render({keepScroll:true}); };
function hiveView(){ hiveState(); return gameHead('hive', `Make words of four letters or more. Every word must use the centre letter, ${HIVE.centre}, and letters can be used more than once.`) + `<div id="hivegame">${hiveBoard()}</div>`; }

const CONN = [

const CONN_START = ['TEAMS','COVER','PANEL','SKILLS','OUTLOOK','REJECTION','PHONE','PROFILE','WORD','GROUP','OFFER','EDUCATION','VIDEO','EXCEL','REFERENCES','RESIGNATION'];
function connState(){ if (!S.conn) S.conn = {order:[...CONN_START], sel:[], solved:[], mistakes:0, guesses:[], msg:'', done:false, shake:false}; return S.conn; }
function connView(){
  const C = connState();
  const solvedRows = C.solved.map(gi => `<div class="conn-solved lvl${gi}"><b>${esc(CONN.at(gi).name)}</b><span>${CONN.at(gi).words.map(w => w[0] + w.slice(1).toLowerCase()).join(', ')}</span></div>`).join('');
  const left = C.order.filter(w => !C.solved.some(gi => CONN.at(gi).words.includes(w)));
  const tiles = left.map(w => `<button class="conn-tile ${C.sel.includes(w) ? 'sel' : ''} ${C.shake && C.sel.includes(w) ? 'shake' : ''} ${w.length > 8 ? 'long' : ''}" data-act="ccsel" data-w="${w}" aria-pressed="${C.sel.includes(w)}" ${C.done ? 'disabled' : ''}>${w}</button>`).join('');
  return gameHead('connections', 'Find four groups of four words that share something. Select four, then submit. You can make four mistakes.') + `

    <p role="status" class="small" style="text-align:center;font-weight:700;min-height:1.5em;margin:12px 0 4px">${esc(C.msg)}</p>
    ${C.done ? `<div class="panel" style="max-width:560px;margin:8px auto 0;text-align:center"><h2>${C.solved.length === 4 && C.mistakes < 4 ? (C.mistakes === 0 ? 'Perfect. No mistakes.' : `Solved with ${C.mistakes} ${C.mistakes === 1 ? 'mistake' : 'mistakes'}.`) : 'Out of guesses. Here are the groups.'}</h2><p class="small muted">The trickiest group is usually the one hiding in plain sight. Today it was words that go before letter.</p><div class="btnrow" style="justify-content:center">${backToGames()}${shareBtn('connections')}</div></div>` : `
    <div class="conn-mistakes small">Mistakes left <span aria-hidden="true">${[0,1,2,3].map(i => `<i class="${i < 4 - C.mistakes ? 'on' : ''}"></i>`).join('')}</span><span class="sr-only">${4 - C.mistakes} of 4</span></div>
    <div class="btnrow conn-ctrls"><button class="btn btn-ghost" data-act="ccshuf">Shuffle</button><button class="btn btn-ghost" data-act="ccclear" ${C.sel.length ? '' : 'disabled'}>Deselect all</button><button class="btn btn-primary" data-act="ccsub" ${C.sel.length === 4 ? '' : 'disabled'}>Submit</button></div>`}
  </div>`;
}
const connDraw = sel => { render({keepScroll:true}); if (sel){ const f = $(sel); if (f) f.focus(); } };
ACT.ccsel = el => { const C = connState(); const w = el.dataset.w; C.shake = false; C.msg = ''; if (C.sel.includes(w)) C.sel = C.sel.filter(x => x !== w); else if (C.sel.length < 4) C.sel.push(w); connDraw(`[data-act=ccsel][data-w="${w}"]`); };
ACT.ccclear = () => { const C = connState(); C.sel = []; C.msg = ''; connDraw('[data-act=ccshuf]'); };
ACT.ccshuf = () => { const C = connState(); for (let i = C.order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [C.order[i], C.order[j]] = [C.order[j], C.order[i]]; } connDraw('[data-act=ccshuf]'); };
ACT.ccsub = () => {
  const C = connState(); if (C.sel.length !== 4) return;
  const key = [...C.sel].sort().join();
  if (C.guesses.some(g => [...g].sort().join() === key)){ C.msg = 'You have already tried that group.'; connDraw('[data-act=ccsub]'); return; }
  C.guesses.push([...C.sel]);
  const gi = CONN.findIndex(g => C.sel.every(w => g.words.includes(w)));
  if (gi > -1){
    C.solved.push(gi); C.sel = []; C.msg = `Correct: ${CONN.at(gi).name}.`;
    if (C.solved.length === 4){ C.done = true; finishGame('connections', Math.max(10, 40 - C.mistakes * 10)); if (!C.mistakes) setTimeout(confetti, 150); }
    connDraw('[data-act=ccsel]');
    return;
  }
  C.mistakes++; C.shake = true;
  const oneAway = CONN.some(g => C.sel.filter(w => g.words.includes(w)).length === 3);
  C.msg = oneAway ? 'One away. Three of those belong together.' : 'Not a group. Try again.';
  if (C.mistakes >= 4){ C.done = true; C.sel = []; CONN.forEach((_, i) => { if (!C.solved.includes(i)) C.solved.push(i); }); C.msg = 'No mistakes left.'; finishGame('connections', 5); }
  connDraw('[data-act=ccsub]');
};

/* ===== Spot the Slip ===== */
const SLIP_TEXT = 'Organised and reliable graduate with strong attension to detail. At Bean There Café I worked closely with the manger to train new staff and helped customers with there orders. I recieved an Employee of the Month award and handled loads of cash payments each day. Confident using Microsoft Excell and Teams.';
const SLIP_FIX = [['attension','attention','Spelling.'],['manger','manager','A manger is where animals feed.'],['there','their','Their shows belonging.'],['recieved','received','I before E, except after C.'],['loads','a high number','"Loads of" is too casual for a CV.'],['Excell','Excel','Get software names exactly right.']];
const slipTokens = () => SLIP_TEXT.split(' ').map(t => { const m = t.match(/^(.*?)([.,]?)$/); return {w:m[1], p:m[2]}; });
function slipState(){ if (!S.slip) S.slip = {found:[], wrong:0, last:null, done:false}; return S.slip; }
function slipView(){
  const L = slipState();
  const toks = slipTokens();
  const words = toks.map((t, i) => {
    const fixIdx = SLIP_FIX.findIndex(f => f.at(0) === t.w);
    const found = L.found.includes(fixIdx) && fixIdx > -1;
    const reveal = L.done && fixIdx > -1;
    if (found || reveal) return `<span class="slipfix ${found ? 'got' : 'miss'}"><s>${esc(t.w)}</s> <b>${esc(SLIP_FIX.at(fixIdx).at(1))}</b></span>${esc(t.p)} `;
    return `<button class="slipword ${L.last === i ? 'nope' : ''}" data-act="slpick" data-i="${i}" ${L.done ? 'disabled' : ''}>${esc(t.w)}</button>${esc(t.p)} `;
  }).join('');
  const head = gameHead('slip', 'An employer spends seconds on a CV, and small mistakes stand out. Tap each word that is wrong. There are six.');
  return head + `<div class="grid-main">
    <section class="panel slipcv" aria-labelledby="slip-h"><div class="cvmini"><b id="slip-h">Jordan Ellis</b><span class="small muted">Peterborough. Graduate, BSc Computing</span></div><h3 style="font-size:.95rem;margin:16px 0 6px">About me and experience</h3><p class="slipbody">${words}</p></section>
    <aside class="stack"><section class="panel"><h2 style="font-size:1.1rem">Mistakes found</h2><div class="slipcount"><b>${L.found.length}</b><span>of ${SLIP_FIX.length}</span></div><div class="meter honey" style="margin:10px 0"><i style="width:${L.found.length / SLIP_FIX.length * 100}%"></i></div>
      <p role="status" class="small" style="font-weight:700;min-height:1.5em">${L.last !== null && !L.done ? 'That one is fine. Look again.' : L.found.length && !L.done ? `${esc(SLIP_FIX.at(L.found.at(-1)).at(2))}` : ''}</p>
      ${L.wrong ? `<p class="small muted" style="margin:0">Wrong taps: ${L.wrong}</p>` : ''}
      ${L.done ? `<div class="btnrow" style="margin-top:12px">${backToGames()}${shareBtn('slip')}</div>` : `<button class="btn btn-quiet" data-act="slreveal" style="margin-top:8px">Show me the answers</button>`}</section>
      <section class="panel"><h2 style="font-size:1.1rem">Why it matters</h2><p class="small" style="margin:0">Spelling mistakes are one of the most common reasons employers give for turning down a CV. Read yours aloud, or use the checker in your CV builder before you apply.</p></section></aside></div>`;
}
ACT.slpick = el => {
  const L = slipState(); const i = +el.dataset.i; const t = slipTokens().at(i);
  const fixIdx = SLIP_FIX.findIndex(f => f.at(0) === t.w);
  if (fixIdx > -1){ L.found.push(fixIdx); L.last = null; if (L.found.length === SLIP_FIX.length){ L.done = true; finishGame('slip', Math.max(5, 30 - L.wrong * 2)); setTimeout(confetti, 150); } }
  else { L.wrong++; L.last = i; }
  render({keepScroll:true}); const n = $(`[data-act=slpick][data-i="${i}"]`) || $('[data-act=slpick]') || $('#app .btn-primary'); if (n) n.focus();
};

function scrAdvance(){ const R = scrState(); if (R.i === SCRAMBLE.length - 1){ R.done = true; const pts = R.solved.reduce((s, i) => s + (R.hints.includes(i) ? 4 : 6), 0); finishGame('scramble', Math.max(5, pts)); if (R.solved.length === 5) setTimeout(confetti, 150); } else R.i++; }

  return {id:'preview',emp:DEMO_PEOPLE.employer,title:D.title || 'Role title',sector:D.sector || 'digital',area:D.area || 'Area',mode:D.mode,hours:+D.hours || 0,pay:+D.pay || 0,weeks:6,programme:D.programme,posted:todayISO(),closes:D.closes || '2026-12-31',starts:D.starts || '2027-01-11',summary:D.summary,duties:lines(D.duties),needs:lines(D.needs),skills:String(D.skills).split(',').map(x => x.trim()).filter(Boolean),questions:[D.q1,D.q2,D.q3].filter(x => x && x.trim())};
}

function postView(){
  if (!S.draft) S.draft = blankDraft();
  const D = S.draft, st = S.postStep;
  const inp = (k, label, opts = {}) => `<div class="field"><label for="d-${k}">${label}${opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</label>
    ${opts.area ? `<textarea id="d-${k}" data-input="draft" data-k="${k}" aria-describedby="d-${k}-err">${esc(D[k])}</textarea>` :
      opts.select ? `<select id="d-${k}" data-change="draft" data-k="${k}" aria-describedby="d-${k}-err"><option value="">Choose</option>${opts.select.map(([v,l]) => `<option value="${v}" ${String(D[k]) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>` :
      `<input id="d-${k}" type="${opts.type || 'text'}" ${opts.step ? `step="${opts.step}"` : ''} data-input="draft" data-k="${k}" value="${esc(D[k])}" aria-describedby="d-${k}-err" ${opts.ph ? `placeholder="${opts.ph}"` : ''}>`}
    <div class="err" id="d-${k}-err" hidden></div></div>`;
  const steps = [
    () => inp('title','Job title',{hint:'Keep it plain, for example "Marketing Intern"'}) + `<div class="row">${inp('sector','Sector',{select:SECTORS.map(s => [s.id,s.name])})}${inp('programme','Type',{select:PROGRAMMES.map(p => [p,p])})}</div>` + inp('summary','Summary',{area:true,hint:'One or two sentences. This shows in search results.'}),
    () => `<div class="row">${inp('area','Area',{select:AREAS.map(a => [a,a])})}${inp('mode','Where they will work',{select:[['On-site','On-site'],['Hybrid','Hybrid'],['Remote','Remote']]})}</div>
      <div class="row">${inp('hours','Hours a week',{type:'number',hint:'Between 15 and 37.5'})}${inp('pay','Pay per hour (£)',{type:'number',step:'0.01',hint:`At least £${minPay().toFixed(2)}, ${minPayLabel()}`})}</div>
      <div class="row">${inp('starts','Start date',{type:'date'})}${inp('closes','Closing date',{type:'date'})}</div>`,
    () => inp('duties','What they will do',{area:true,hint:'One task per line'}) + inp('needs','What they need',{area:true,hint:'One requirement per line. Only include what is essential.'}) + inp('skills','Skills they will use',{hint:'Separate with commas. We use these to match candidates.'}),
    () => `<p class="muted">Ask up to three short questions. Applicants answer them when they apply. Optional.</p>${inp('q1','Question 1')}${inp('q2','Question 2')}${inp('q3','Question 3')}
      <div class="panel" style="background:var(--surface);margin-top:8px"><h3 style="font-size:1rem">Before you submit</h3><ul class="checklist small">
      ${[[`Pay is at least ${minPayLabel()}`, +D.pay >= minPay()],['Hours, location and dates are filled in', D.hours && D.area && D.starts && D.closes],['At least one duty and one requirement', D.duties.trim() && D.needs.trim()]].map(([t,ok]) => `<li class="${ok ? 'ok' : 'bad'}">${icon(ok ? 'check' : 'alert')}<span>${t}${ok ? '' : ' <b>(check this)</b>'}</span></li>`).join('')}</ul></div>`
  ];
  return `<div class="pagehead"><div><h1>${D.id ? 'Edit role' : 'Post a role'}</h1><p>About ten minutes. The CPCA team checks every listing before it goes live.</p></div><button class="btn btn-quiet" data-act="post-example">Fill with an example</button></div>
  <ol class="stepper">${STEPS.map((s,i) => `<li class="${i < st ? 'done' : i === st ? 'now' : ''}" ${i === st ? 'aria-current="step"' : ''}>Step ${i + 1}<br>${s}</li>`).join('')}</ol>
  <div class="grid-main">
    <form class="panel" data-form="post" novalidate><h2>${STEPS[st]}</h2>${steps[st]()}
      <div style="display:flex;gap:10px;justify-content:space-between;margin-top:8px;flex-wrap:wrap">

        <button class="btn btn-primary">${st === 3 ? 'Submit for approval' : 'Continue'}</button>
      </div></form>
    <aside id="post-preview">${postPreview()}</aside>

}
INPUT.draft = el => { S.draft[el.dataset.k] = el.value; const p = $('#post-preview'); if (p) p.innerHTML = postPreview(); };
ACT['post-back'] = () => { S.postStep--; render(); };
ACT['post-save'] = () => { saveDraft('draft'); toast('Draft saved'); go('#/employer/listings'); };
function saveDraft(statusVal){
  const D = S.draft; const j = draftAsJob(D);
  const existing = D.id ? job(D.id) : null;
  const rec = {...j, id:existing ? existing.id : uid('j'), status:statusVal, views:existing ? existing.views : 0, posted:'', submitted:todayISO()};
  if (existing) Object.assign(existing, rec); else S.jobs.push(rec);
  delete S.returned[rec.id];
  S.draft = null; S.postStep = 0;
  return rec;
}
FORM.post = f => {
  const D = S.draft; const st = S.postStep;
  const need = [['title','sector','summary'],['area','mode','hours','pay','starts','closes'],['duties','needs','skills'],[]][st];
  let first = null;
  const fail = (k, msg) => { const e = $('#d-' + k + '-err'); if (e){ e.textContent = msg; e.hidden = false; } const i = $('#d-' + k); if (i){ i.setAttribute('aria-invalid','true'); first = first || i; } };
  $$('.err', f).forEach(e => e.hidden = true); $$('[aria-invalid]', f).forEach(e => e.removeAttribute('aria-invalid'));
  need.forEach(k => { if (!String(D[k]).trim()) fail(k, 'Fill in this field'); });
  if (st === 1){
    if (D.pay && +D.pay < minPay()) fail('pay', `Pay must be at least £${minPay().toFixed(2)} an hour, ${minPayLabel()}`);
    if (D.hours && (+D.hours < 15 || +D.hours > 37.5)) fail('hours', 'Enter between 15 and 37.5 hours');
    if (D.closes && d(D.closes) <= TODAY) fail('closes', 'The closing date must be in the future');
    if (D.starts && D.closes && d(D.starts) <= d(D.closes)) fail('starts', 'The start date must be after the closing date');
  }
  if (first){ first.focus(); return; }
  if (st < 3){ S.postStep++; render(); return; }
  const rec = saveDraft('pending');
  notify('cpca', `${ME_EMP().name} submitted ${rec.title} for approval`, '#/cpca/approvals/' + rec.id);
  toast('Submitted for approval. We will review it within two working days.');
  go('#/employer/listings');
};

/* ---------- Employer: listing insights ---------- */
function seeded(n, seed){ let x = 0; for (const ch of seed) x = (x * 31 + ch.charCodeAt(0)) % 9973; return Array.from({length:n}, (_, i) => { x = (x * 7919 + 17) % 9973; return x / 9973; }); }
function insightsView(id){
  const j = job(id); if (!j || j.emp !== DEMO_PEOPLE.employer) return '<h1>Listing not found</h1>';
  const apps = appsFor(j.id);
  const rnd = seeded(14, j.id);
  const days = rnd.map((r, i) => Math.round((j.views / 14) * (0.55 + r * 0.9) * (i > 9 ? 1.25 : 1)));
  const shortl = apps.filter(a => ['shortlisted','interview','offer','placed'].includes(a.status)).length;
  const intv = apps.filter(a => ['interview','offer','placed'].includes(a.status)).length;
  const funnel = [['Viewed the listing', j.views],['Applied', apps.length],['Shortlisted', shortl],['Interviewed', intv]];
  const W = 640, H = 200, pb = 26, pt = 14, max = Math.max(...days) * 1.15, bw = W / days.length;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const line = days.map((v, i) => `${i ? 'L' : 'M'}${(i + .5) * bw} ${y(v)}`).join('');
  const area = line + `L${(days.length - .5) * bw} ${H - pb}L${bw / 2} ${H - pb}Z`;
  const labels = Array.from({length:14}, (_, i) => { const x = new Date(TODAY.getTime() - (13 - i) * 864e5); return `${x.getDate()} ${MONTHS[x.getMonth()]}`; });
  const skills = {}; apps.forEach(a => { const i = intern(a.intern); (a.intern === DEMO_PEOPLE.intern ? S.cv.skills : i.skills).forEach(s => skills[s] = (skills[s] || 0) + 1); });
  const topSkills = Object.entries(skills).sort((a, b) => b[1] - a[1]).slice(0, 6);
  return `<a class="back" href="#/employer/listings">${icon('left')}My listings</a>

/* Charts: single series, one hue, rounded data-ends, hover and focus tooltips */
function columnChart(data, {label, unit='applications'} = {}){
  const W = 640, H = 240, padL = 34, padB = 28, padT = 26, max = Math.ceil(Math.max(...data.map(x => x.n)) / 10) * 10;
  const bw = (W - padL - 10) / data.length, barW = Math.min(36, bw * .55);
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const peak = data.reduce((m,x,i) => x.n > data[m].n ? i : m, 0);
  const ticks = [0, max / 2, max];
  const pid = 'hp' + Math.random().toString(36).slice(2, 7);
  return `<div class="chart" style="position:relative"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <defs><pattern id="${pid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EEF0FF"/><rect width="2" height="6" fill="#9AA3FF"/></pattern><linearGradient id="${pid}g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4B57FF"/><stop offset="1" stop-color="#2E3BFF"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${padL}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}" stroke="#E4E6ED" stroke-dasharray="3 4" stroke-width="1"/><text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    ${data.map((x,i) => { const cx = padL + bw * i + bw / 2, top = y(x.n), h = H - padB - top, partial = i === data.length - 1;
      const r = Math.min(4, h);
      return `<g class="bar" tabindex="0" data-tip="${esc(x.w)}${partial ? ' (week so far)' : ''}: ${x.n} ${unit}" aria-label="Week of ${esc(x.w)}${partial ? ', so far' : ''}: ${x.n} ${unit}">
        <rect x="${cx - bw / 2}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent"/>
        <path d="M${cx - barW / 2} ${H - padB}V${top + r}Q${cx - barW / 2} ${top} ${cx - barW / 2 + r} ${top}H${cx + barW / 2 - r}Q${cx + barW / 2} ${top} ${cx + barW / 2} ${top + r}V${H - padB}Z" fill="${partial ? `url(#${pid})` : `url(#${pid}g)`}" class="grow" style="animation-delay:${i * 60}ms"/>
        ${i === peak || partial ? `<text class="val" x="${cx}" y="${top - 6}" text-anchor="middle">${x.n}</text>` : ''}
        <text x="${cx}" y="${H - 9}" text-anchor="middle">${esc(x.w)}</text></g>`; }).join('')}
    <line x1="${padL}" x2="${W - 6}" y1="${H - padB}" y2="${H - padB}" stroke="#CDD2DD"/>
  </svg><div class="tip charttip" role="tooltip" hidden></div>
  <p class="small muted" style="margin:6px 0 0">The hatched bar is the current week, still in progress.</p></div>`;
}
function hbars(data){
  const max = Math.max(...data.map(x => x.n));
  return data.map(x => `<div class="bar-h"><span>${esc(x.s)}</span><span class="b"><i style="width:${x.n / max * 100}%"></i></span><span class="n">${x.n}</span></div>`).join('');
}
AFTER.push(() => {
  $$('.chart').forEach(ch => {
    const tip = $('.tip', ch); if (!tip) return;
    const show = g => { const r = g.getBoundingClientRect(), c = ch.getBoundingClientRect(); tip.textContent = g.dataset.tip; tip.hidden = false; tip.style.left = (r.left - c.left + r.width / 2) + 'px'; tip.style.top = (g.querySelector('path').getBoundingClientRect().top - c.top) + 'px'; };
    $$('.bar', ch).forEach(g => { g.addEventListener('mouseenter', () => show(g)); g.addEventListener('focus', () => show(g)); g.addEventListener('mouseleave', () => tip.hidden = true); g.addEventListener('blur', () => tip.hidden = true); });
  });
});

function listingChecks(j){
  const e = emp(j.emp);
  const text = [j.summary, ...j.duties, ...j.needs].join(' ');
  return [
    {ok:e.verified, t:'Employer is verified', fix:`${e.name} has not been verified yet`},
    {ok:j.pay >= minPay(), t:`Pay is at least £${minPay().toFixed(2)} an hour (${minPayLabel()})`, fix:`Pay is ${money(j.pay)} an hour, below ${minPayLabel()} of £${minPay().toFixed(2)}`},
    {ok:daysUntil(j.closes) >= S.rules.minOpenDays, t:`Open for at least ${S.rules.minOpenDays} days`, fix:`Closes in under ${S.rules.minOpenDays} days`},
    {ok:j.duties.length > 0 && j.needs.length > 0, t:'Duties and requirements filled in', fix:'Missing duties or requirements'},
    {ok:d(j.starts) > d(j.closes), t:'Start date is after the closing date', fix:'Start date is before the closing date'},
    {ok:!/@|https?:/.test(text), t:'Applications go through Talent Hive, not email', fix:'Listing text includes an email address or link'}
  ];
}

const LEARN = {Git:'Git basics, 2 hours online', Accessibility:'Web accessibility essentials, 3 hours online', 'AI tools':'Using AI tools at work, 90 minutes online', Data:'Data skills for beginners, 4 hours online', Research:'User research basics, 2 hours online', Presenting:'Presenting with confidence, Profile Power Up session', Figma:'Figma for beginners, 3 hours online', CAD:'Intro to CAD, 5 hours online', SolidWorks:'SolidWorks fundamentals, 6 hours online', 'Lab safety':'Lab safety awareness, 1 hour online', 'Health and safety':'Health and safety at work, 1 hour online', Copywriting:'Writing for the web, 2 hours online', 'Content creation':'Short-form video basics, 2 hours online', Bookkeeping:'Bookkeeping basics, 3 hours online'};
const miles = (a, b) => { const [la1, lo1] = TOWNS[a] || [0,0], [la2, lo2] = TOWNS[b] || [0,0]; const R = 3959, r = x => x * Math.PI / 180; const dLa = r(la2 - la1), dLo = r(lo2 - lo1); const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(la1)) * Math.cos(r(la2)) * Math.sin(dLo / 2) ** 2; return Math.round(2 * R * Math.asin(Math.sqrt(h))); };
function matchPanel(j){
  const me = intern(DEMO_PEOPLE.intern); const mine = S.cv.skills.map(s => s.toLowerCase());
  const have = j.skills.filter(s => mine.includes(s.toLowerCase())), gap = j.skills.filter(s => !mine.includes(s.toLowerCase()));
  const dist = miles(me.area, j.area); const sc = matchScore(j);
  return `<section class="panel matchpanel" aria-labelledby="mp-h"><div class="mp-top">${ring(sc / 100, sc + '%').replace('of 6', 'match')}<div><h2 id="mp-h" style="margin:0 0 4px">Why this matches you</h2><p class="small muted" style="margin:0">Based on the skills on your CV, where you live and when you can start.</p></div></div>

      <li class="ok">${icon('pin')}<span><b>${dist ? `About ${dist} miles` : 'In your town'}</b> from ${esc(me.area)}${dist > 15 ? ', so check travel times before you apply' : ''}</span></li>
      <li class="ok">${icon('clock')}<span><b>${j.hours} hours a week</b> from ${fmt(j.starts)}, which fits your availability (${esc(me.availability.toLowerCase())})</span></li>
    </ul>
    ${gap.length ? `<div class="callout-ins"><b>Skills to build:</b> ${gap.map(s => `<span class="nowrap">${esc(s)}</span>`).join(', ')}<ul class="small" style="margin:6px 0 0;padding-left:1.1em">${gap.map(s => `<li>${esc(LEARN[s] || 'Free short course in the Talent Hive skills library')}</li>`).join('')}</ul></div>` : '<div class="okbox" style="margin-top:12px">' + icon('check') + '<div>You have every skill this role asks for.</div></div>'}

    `This role involves "${j.duties[0].toLowerCase()}". Tell me about a time you did something similar.`,

}

    else if (a.slots) a.slots.forEach(s => ev.push({iso:s, title:intern(a.intern).name, sub:'Offered, not picked yet', app:a.id, kind:'o'}));
  });
  if (!ev.some(e => e.app === 'a8')) ev.push({iso:'2026-11-27T14:00', title:'Kieran Walsh', sub:'Junior Web Developer Intern', app:'a8', kind:'b'});
  ev.push({iso:'2026-11-25T11:00', title:'Ben Okoro', sub:'Phone screen', app:'a6', kind:'b'}, {iso:'2026-11-24T15:30', title:'Ella Brooks', sub:'Week 4 check-in', kind:'p'}, {iso:'2026-11-26T10:00', title:'Team catch-up', sub:'Shortlist review', kind:'t'},
    {iso:'2026-12-01T11:00', title:'Team catch-up', sub:'Shortlist review', kind:'t'}, {iso:'2026-12-03T15:30', title:'Ella Brooks', sub:'Week 5 check-in', kind:'p'});
  const H0 = 9, H1 = 17, ph = 52;
  const inWeek = ev.filter(e => days.includes(e.iso.slice(0, 10)));
  const pending = S.apps.filter(a => a.status === 'interview' && a.slots && job(a.job).emp === DEMO_PEOPLE.employer);

  <div class="chips" style="margin-bottom:14px"><span class="chip"><i class="lg-dot" style="background:var(--blue)"></i>Booked</span><span class="chip"><i class="lg-dot hatch"></i>Offered, waiting for a pick</span><span class="chip"><i class="lg-dot" style="background:#F7A8EE"></i>Placement check-in</span><span class="chip"><i class="lg-dot" style="background:var(--lime-50)"></i>Team</span></div>
  ${pending.length ? `<div class="infobar">${icon('clock')}<span>${pending.length} ${pending.length === 1 ? 'candidate has' : 'candidates have'} not picked a time yet. Their offered times show as striped blocks${wk === 0 ? ' next week' : ''}.</span></div>` : ''}
  <section class="panel cal"><div class="cal-grid"><div class="cal-times">${Array.from({length:H1 - H0}, (_, i) => `<span style="top:${i * ph}px">${String(H0 + i).padStart(2,'0')}:00</span>`).join('')}</div>
    ${days.map(dd => { const x = d(dd); const list = inWeek.filter(e => e.iso.startsWith(dd)); const today = dd === todayISO(); return `<div class="cal-day ${today ? 'today' : ''}"><div class="cal-h"><span class="small muted">${DAYS_L[x.getDay()].slice(0,3)}</span><b>${x.getDate()}</b></div><div class="cal-body" style="height:${(H1 - H0) * ph}px">${list.map(e => { const t = new Date(e.iso); const top = (t.getHours() + t.getMinutes() / 60 - H0) * ph; return `<button class="cal-ev k-${e.kind}" style="top:${top}px;height:${ph * .85}px" ${e.app ? `data-act="cand" data-id="${e.app}"` : 'data-act="noop"'}><b>${esc(e.title)}</b><span>${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}. ${esc(e.sub)}</span></button>`; }).join('')}</div></div>`; }).join('')}
  </div></section>`;
}

/* ---------- CPCA: live feed and cohort timeline ---------- */
const FEED_POOL = ['Maya Patel saved Lab Operations Intern','Nene Build Group viewed 2 applications','Ben Okoro booked a Profile Power Up place','Lucy Tran applied for Data and AI Intern','Riverside Accounts moved Tariq Ahmed to Shortlisted','Hana Kowalski completed her CV','Sofia Marques logged 30 hours for week 1','Callum Reid played today\'s Career Wordle','Isle of Ely Learning Trust replied to a message','Oliver Grant uploaded proof of address'];
let feedTick = null, feedI = 0, feedPaused = false;
function feedPanel(){ return `<section class="panel"><div class="section-head" style="margin-bottom:6px"><h2 style="margin:0;display:flex;align-items:center;gap:8px"><span class="live-dot" aria-hidden="true"></span>Live activity</h2><button class="btn btn-quiet btn-sm" data-act="feedpause">${feedPaused ? 'Resume' : 'Pause'}</button></div><ul class="feed" id="feed" aria-live="off">${S.feed.slice(0, 6).map(x => `<li><span class="small muted">${esc(x.t)}</span><span>${esc(x.text)}</span></li>`).join('')}</ul></section>`; }

  }, 6000);
