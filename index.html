<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Hive redesign concept</title>
<meta name="description" content="A design concept by Alexej Zhukov for a redesigned Talent Hive internship platform in Cambridgeshire and Peterborough. Sample data only; not an official CPCA website.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Talent Hive redesign concept">
<meta property="og:description" content="A clickable design concept by Alexej Zhukov: a jobs board, applicant pipeline and approvals for interns, employers and the CPCA team. Sample data only.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://al3x3j02.github.io/talent-hive-concept/preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2A47;
  --ink-2:#2C4560;
  --muted:#56677B;
  --blue:#1E9BD7;
  --link:#0B78B0;
  --blue-50:#E8F5FC;
  --honey:#F2A93B;
  --honey-50:#FEF3E1;
  --honey-ink:#8A5200;
  --mint:#2F9E6E;
  --mint-50:#E4F4EC;
  --mint-ink:#1D6E4B;
  --red:#B8392F;
  --red-50:#FBEAE8;
  --surface:#F6F8FB;
  --surface-2:#EDF1F6;
  --line:#DCE3EC;
  --white:#FFFFFF;
  --focus:0 0 0 3px #fff,0 0 0 6px var(--blue);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-panel:16px;--r-card:12px;--r-ctl:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.55;color:var(--ink);background:var(--surface);}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:clamp(2rem,4.2vw,3.25rem);font-weight:700;letter-spacing:-.025em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.2rem;font-weight:650}
h4{font-size:1rem;font-weight:650}
p{margin:0 0 1em}
a{color:var(--link);text-underline-offset:3px}
a:hover{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
[tabindex="-1"]:focus{outline:none;box-shadow:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{top:52px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.nowrap{white-space:nowrap}

/* Demo bar */
.demobar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;font-size:.875rem;display:flex;align-items:center;gap:12px;padding:6px 16px;flex-wrap:wrap}
.demobar strong{font-family:var(--display);font-weight:600}
.demobar .note{opacity:.8}
.demobar .roles{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
.demobar .roles span{opacity:.8;margin-right:4px}
.demobar button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:3px 12px;cursor:pointer}
.demobar button[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:var(--ink);font-weight:700}
.demobar button:hover{border-color:#fff}
.demobar .reset{border-style:dashed}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-ctl);padding:10px 18px;font-weight:700;border:1.5px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#18406A;color:#fff}
.btn-honey{background:var(--honey);color:var(--ink)}
.btn-honey:hover{background:#E59A27;color:var(--ink)}
.btn-ghost{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-2);color:var(--ink)}
.btn-quiet{background:transparent;color:var(--link);padding:8px 10px}
.btn-quiet:hover{background:var(--blue-50);color:var(--ink)}
.btn-danger{background:var(--white);border-color:#E7B9B4;color:var(--red)}
.btn-sm{padding:6px 12px;font-size:.875rem;border-radius:8px}
.btn-lg{padding:14px 22px;font-size:1.05rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{background:transparent;border:0;padding:8px;border-radius:8px;cursor:pointer;color:var(--ink-2);display:inline-flex}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"] svg{fill:var(--honey);stroke:var(--honey-ink)}

/* Forms */
label{font-weight:700;display:block;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:.875rem;display:block;margin-top:2px}
.field{margin-bottom:18px}
input[type=text],input[type=search],input[type=email],input[type=number],input[type=date],select,textarea{width:100%;background:var(--white);border:1.5px solid #B9C6D4;border-radius:var(--r-ctl);padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(30,155,215,.35);outline:none}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.row{display:flex;gap:16px}
.row>*{flex:1}
.err{color:var(--red);font-weight:700;font-size:.9rem;margin-top:6px}

/* Chips and status */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:.82rem;line-height:1.5;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-applied,.st-new,.st-live{background:var(--blue-50);color:#0A5F8C}
.st-viewed{background:#EEF2F7;color:var(--ink-2)}
.st-shortlisted,.st-pending{background:var(--honey-50);color:var(--honey-ink)}
.st-interview{background:#FFE7C2;color:#7A4600}
.st-offer,.st-placed,.st-approved{background:var(--mint-50);color:var(--mint-ink)}
.st-notprogressed,.st-returned,.st-closed{background:var(--red-50);color:var(--red)}
.st-draft{background:#EEF2F7;color:var(--muted)}
.tag-new{background:var(--honey);color:var(--ink);font-weight:700;font-size:.75rem;padding:1px 8px;border-radius:999px}

/* Hexagon */
.hex{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}

/* Public header */
.pub-header{background:var(--white);border-bottom:1px solid var(--line)}
.pub-header .inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:14px 24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:34px;height:30px;background:var(--honey);display:grid;place-items:center}
.brand .mark i{width:18px;height:16px;background:var(--ink);display:block}
.brand b{font-family:var(--display);font-size:1.25rem;letter-spacing:-.02em}
.concept-tag{font-family:var(--body);font-size:.7rem;font-weight:700;letter-spacing:0;background:var(--honey-50);color:var(--honey-ink);border:1px solid #F6D9A8;border-radius:999px;padding:1px 7px;vertical-align:3px}
.demobar .about{border:0;text-decoration:underline;text-underline-offset:3px;padding:3px 4px}
.brand small{display:block;font-size:.72rem;color:var(--muted);line-height:1.1;font-weight:400}
.pub-nav{display:flex;gap:4px;margin-left:12px}
.pub-nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:700}
.pub-nav a:hover,.pub-nav a[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.pub-header .actions{margin-left:auto;display:flex;gap:8px}

/* Hero */
.hero{background:var(--white);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.hero .inner{max-width:1200px;margin:0 auto;padding:56px 24px 64px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center}
.hero h1{max-width:15ch;margin-bottom:.35em;text-wrap:balance}
.hero .lede{font-size:1.15rem;color:var(--ink-2);max-width:46ch}
.searchbar{display:flex;gap:8px;background:var(--surface);padding:8px;border-radius:14px;border:1.5px solid var(--line);margin-top:28px;max-width:600px}
.searchbar input,.searchbar select{border:0;background:var(--white);min-height:48px}
.searchbar select{max-width:190px}
.searchbar .btn{min-height:48px;white-space:nowrap}
.hero .closing{margin-top:16px;color:var(--muted);font-size:.95rem}
.comb{position:relative;height:420px}
.comb button{position:absolute;width:150px;height:132px;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px;font-family:var(--display);font-weight:650;font-size:1rem;line-height:1.15;transition:transform .2s}
.comb button small{font-family:var(--body);font-weight:400;font-size:.85rem;margin-top:4px}
.comb button:hover{transform:scale(1.05)}
.comb button:focus-visible{box-shadow:none;outline:3px solid var(--blue);outline-offset:-10px}
.comb .c-ink{background:var(--ink);color:#fff}
.comb .c-honey{background:var(--honey);color:var(--ink)}
.comb .c-blue{background:var(--blue-50);color:var(--ink)}
.comb .c-line{background:var(--surface-2);color:var(--ink)}
.comb .c-mint{background:var(--mint-50);color:var(--ink)}
.comb .label{position:absolute;left:0;bottom:-6px;font-size:.9rem;color:var(--muted)}

/* Public sections */
.section{max-width:1200px;margin:0 auto;padding:56px 24px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.section-head p{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.steps li{list-style:none;position:relative;padding-top:56px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:44px;height:40px;background:var(--honey);color:var(--ink);font-family:var(--display);font-weight:700;display:grid;place-items:center;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.steps{padding:0;margin:0}
.employer-band{background:var(--ink);color:#fff}
.employer-band .section{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.employer-band h2{color:#fff;font-size:2rem}
.employer-band p{color:#D4DEEA}
.employer-band ul{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.employer-band li{display:flex;gap:12px;align-items:flex-start}
.employer-band li svg{flex:none;width:22px;height:22px;stroke:var(--honey);margin-top:2px}
.pub-footer{border-top:1px solid var(--line);background:var(--white)}
.pub-footer .section{padding:32px 24px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}

/* Job rows */
.joblist{display:flex;flex-direction:column;gap:10px}
.jobrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:start;background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;cursor:pointer;text-align:left;width:100%}
.jobrow:hover{border-color:#9FB2C6}
.jobrow h3{font-size:1.1rem;margin:0 0 2px}
.jobrow h3 a{color:var(--ink);text-decoration:none}
.jobrow h3 a::after{content:"";position:absolute;inset:0}
.jobrow{position:relative}
.jobrow .emp{color:var(--ink-2);margin-bottom:8px}
.jobrow .jside{display:flex;flex-direction:column;align-items:flex-end;gap:8px;position:relative;z-index:1}
.logo{width:52px;height:46px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:1rem;flex:none}
.logo.lg{width:76px;height:68px;font-size:1.4rem}
.match{font-size:.82rem;font-weight:700;color:var(--mint-ink)}

/* App shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 38px);background:linear-gradient(to right,#fff 251px,var(--line) 251px,var(--line) 252px,var(--surface) 252px)}
.side{background:var(--white);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:38px;height:calc(100vh - 38px);overflow:auto;display:flex;flex-direction:column}
.side .brand{padding:4px 8px 18px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:700}
.side nav a svg{width:20px;height:20px;flex:none}
.side nav a:hover{background:var(--surface)}
.side nav a[aria-current="page"]{background:var(--ink);color:#fff}
.side nav a .count{margin-left:auto;background:var(--honey);color:var(--ink);border-radius:999px;font-size:.75rem;padding:0 8px}
.side nav a[aria-current="page"] .count{background:#fff}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 4px;border-top:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem;flex:none}
.avatar.lg{width:64px;height:64px;font-size:1.3rem}
.who b{display:block;line-height:1.2}
.who div span{font-size:.82rem;color:var(--muted)}
.main{padding:28px 36px 64px;max-width:1240px;width:100%}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.pagehead h1{font-size:2rem;margin:0}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-weight:700;text-decoration:none}
.back svg{width:18px;height:18px}

/* Panels */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);padding:22px}
.panel h2{font-size:1.2rem}
.panel+.panel{margin-top:20px}
.grid-2>.panel,.grid-3>.panel,.grid-main>.panel,.grid-main>aside.panel{margin-top:0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.stack>*+*{margin-top:20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px}
.kpi .v{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:.9rem}
.kpi .d{font-size:.82rem;color:var(--mint-ink);font-weight:700}

/* Next step banner */
.nextstep{background:var(--ink);color:#fff;border-radius:var(--r-panel);padding:22px 24px;display:flex;gap:20px;align-items:center;margin-bottom:20px;position:relative;overflow:hidden}
.nextstep h2{color:#fff;margin:0 0 4px;font-size:1.3rem}
.nextstep p{margin:0;color:#D4DEEA}
.nextstep .btn{margin-left:auto;flex:none}
.nextstep .hexdeco{width:64px;height:56px;background:var(--honey);flex:none;display:grid;place-items:center}
.nextstep .hexdeco svg{width:26px;height:26px;stroke:var(--ink)}

/* Progress */
.meter{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-radius:999px;transition:width .3s}
.meter.honey i{background:var(--honey)}

/* Tables */
.table{width:100%;border-collapse:collapse;font-size:.95rem}
.table th{text-align:left;font-weight:700;color:var(--muted);font-size:.85rem;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;position:relative}

/* Jobs board */
.board{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.filters{background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);padding:18px;position:sticky;top:60px}
.filters fieldset{border:0;padding:0;margin:0 0 18px}
.filters legend{font-weight:700;margin-bottom:8px}
.filters .check{margin-bottom:6px}
.resultbar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.resultbar select{width:auto;min-height:40px}
.boardsearch{display:flex;gap:8px;margin-bottom:16px}
.boardsearch input{min-height:48px}
.empty{text-align:center;padding:40px 20px;background:var(--white);border:1.5px dashed var(--line);border-radius:var(--r-panel)}

/* Job detail */
.jobhead{display:flex;gap:20px;align-items:flex-start;margin-bottom:20px}
.jobhead h1{font-size:2.2rem;margin-bottom:4px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin-bottom:24px}
.facts div{background:var(--white);padding:14px 16px}
.facts dt{font-size:.82rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700}
.prose h2{font-size:1.25rem;margin-top:1.4em}
.prose ul{padding-left:1.2em}
.prose li{margin-bottom:6px}
.applybox{position:sticky;top:60px}
.applybox .deadline{font-size:.95rem;margin:10px 0 16px}

/* Modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(14,42,71,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:var(--r-panel);width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;box-shadow:0 20px 60px rgba(14,42,71,.25)}
.modal header,.drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal header>div,.drawer header>div{min-width:0}
.modal h2{margin:0}
.modal footer,.drawer footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.drawer-ov{justify-content:flex-end;padding:0;align-items:stretch}
.drawer{background:var(--white);width:min(560px,100%);height:100%;overflow:auto;padding:26px;box-shadow:-10px 0 40px rgba(14,42,71,.2)}
.cvchip{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-card);padding:12px;background:var(--surface)}
.cvchip svg{width:28px;height:28px;stroke:var(--link)}

/* Toast */
#toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(14,42,71,.3);font-weight:700;animation:pop .25s ease-out}
.toast svg{width:20px;height:20px;stroke:var(--honey)}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* Tracker */
.track{display:flex;gap:0;margin:14px 0 4px;list-style:none;padding:0}
.track li{flex:1 1 0;min-width:0;white-space:nowrap;position:relative;text-align:center;font-size:.78rem;color:var(--muted);padding-top:22px}
.track li::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--white);border:2px solid #B9C6D4;z-index:1}
.track li::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#D2DBE6}
.track li:first-child::after{display:none}
.track li.done{color:var(--ink)}
.track li.done::before{background:var(--mint);border-color:var(--mint)}
.track li.done::after{background:var(--mint)}
.track li.now{color:var(--ink);font-weight:700}
.track li.now::before{background:var(--honey);border-color:var(--honey-ink);width:16px;height:16px;margin-left:-8px;top:4px}
.appcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px}

const MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const fmt = s => { if(!s) return ''; const x = d(s); return `${x.getDate()} ${MONTHS[x.getMonth()]}`; };
const fmtLong = s => { const x = d(s); return `${DAYS_L[x.getDay()]} ${x.getDate()} ${MONTHS_L[x.getMonth()]} ${x.getFullYear()}`; };

function closingText(j){
  const n = daysUntil(j.closes);
  if (n < 0) return 'Closed';
  if (n === 0) return 'Closes today';
  if (n === 1) return 'Closes tomorrow';
  if (n <= 7) return `Closes in ${n} days`;
  return `Closes ${fmt(j.closes)}`;
}
function matchScore(j, i = intern(DEMO_PEOPLE.intern)){
  const sk = j.skills.filter(s => S.cv.skills.map(x => x.toLowerCase()).includes(s.toLowerCase())).length;
  let score = 40 + Math.round(40 * sk / Math.max(1, j.skills.length));
  if ((i.sectors || []).includes(j.sector)) score += 12;
  if (j.area === i.area) score += 8;
  return Math.min(98, score);
}

/* ---------- Toast and modal ---------- */
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${icon('check')}<span>${esc(msg)}</span>`;
  const root = $('#toast-root'); root.appendChild(t); while (root.children.length > 2) root.firstChild.remove();
  setTimeout(() => t.remove(), 3200);
}
let lastFocus = null;
function openModal(html, {drawer=false, label='Dialog'} = {}){
  lastFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="overlay ${drawer ? 'drawer-ov' : ''}" data-act="overlay"><div class="${drawer ? 'drawer' : 'modal'}" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1">${html}</div></div>`;
  const box = $('#modal-root [role=dialog]');
  const first = box.querySelector('input,textarea,select,button:not(.icon-btn)');
  (first || box).focus();
}
function closeModal(){
  $('#modal-root').innerHTML = '';
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
  if (e.key === 'Tab' && $('#modal-root [role=dialog]')){
    const f = $$('#modal-root [role=dialog] a, #modal-root [role=dialog] button, #modal-root [role=dialog] input, #modal-root [role=dialog] textarea, #modal-root [role=dialog] select').filter(x => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)){ e.preventDefault(); f[0].focus(); }
  }
});

/* ---------- Jobs board (shared) ---------- */
function filteredJobs(){
  const F = S.filters;
  const q = F.q.toLowerCase();
  let list = liveJobs().filter(j => {
    const e = emp(j.emp);
    if (q && !(j.title + ' ' + e.name + ' ' + j.skills.join(' ') + ' ' + sectorName(j.sector) + ' ' + j.summary).toLowerCase().includes(q)) return false;
    if (F.area && j.area !== F.area) return false;
    if (F.sectors.size && !F.sectors.has(j.sector)) return false;
    if (F.modes.size && !F.modes.has(j.mode)) return false;
    if (F.programme && j.programme !== F.programme) return false;
    if (F.minPay && j.pay < 13) return false;
    return true;
  });
  const sorts = {
    newest:(a,b) => d(b.posted) - d(a.posted),
    closing:(a,b) => d(a.closes) - d(b.closes),
    pay:(a,b) => b.pay - a.pay,
    match:(a,b) => matchScore(b) - matchScore(a)
  };
  return list.sort(sorts[F.sort] || sorts.newest);
}

function cvChecks(){
  const c = S.cv;
  return [
    {ok:!!(c.headline && c.headline.length > 10), tip:'Add a headline'},
    {ok:c.about.length >= 80, tip:'Write at least two sentences about yourself'},
    {ok:c.exp.length >= 1, tip:'Add some experience, paid or unpaid'},
    {ok:c.edu.length >= 1, tip:'Add your education'},
    {ok:c.skills.length >= 5, tip:'Add at least five skills'},
    {ok:!!(c.link && c.link.trim()), tip:'Add a link to a project or portfolio'}
  ];
}
const cvPct = () => { const c = cvChecks(); return Math.round(100 * c.filter(x => x.ok).length / c.length); };

function trackHTML(a){
  if (a.status === 'notprogressed') return '';
  const steps = ['applied','viewed','shortlisted','interview','offer'];
  const at = a.status === 'placed' ? 5 : steps.indexOf(a.status);
  return `<ol class="track" aria-label="Progress: ${STATUS_LABEL[a.status]}">${steps.map((s,i) => `<li class="${i < at ? 'done' : i === at ? 'now' : ''}">${STATUS_LABEL[s]}</li>`).join('')}</ol>`;
}

FORM.apply = f => {
  const j = job(f.dataset.id);
  let ok = true, first = null;
  j.questions.forEach((q,i) => { const t = f['q' + i]; const bad = !t.value.trim(); $('#ap-q' + i + '-err').hidden = !bad; t.setAttribute('aria-invalid', bad); if (bad){ ok = false; first = first || t; } });
  const c = f.confirm; $('#ap-c-err').hidden = c.checked; if (!c.checked){ ok = false; first = first || c; }
  if (!ok){ first.focus(); return; }
  S.apps.unshift({id:uid('a'), job:j.id, intern:DEMO_PEOPLE.intern, status:'applied', note:f.note.value.trim(), answers:j.questions.map((q,i) => f['q' + i].value.trim()), history:[['applied', todayISO()]]});

  toast(`Application sent to ${emp(j.emp).name}`);

};

function cvMeter(){

function cvBuilder(){
  const c = S.cv;

  return `<div class="pagehead"><div><h1>My CV</h1><p>Employers see this when you apply. Changes save as you type.</p></div><button class="btn btn-ghost" data-act="printcv">${icon('download')}Download as PDF</button></div>

    <div class="stack">
      <section class="panel"><h2>The basics</h2>
        ${f('Full name','name',c.name)}${f('Headline','headline',c.headline,{hint:'One line about you and what you are looking for'})}
        <div class="row">${f('Email','email',c.email)}${f('Area','area',c.area)}</div>
        ${f('Portfolio or project link','link',c.link || '',{hint:'Optional. A website, GitHub or online portfolio',ph:'For example github.com/yourname'})}

/* Career Wordle */
function wordleState(){
  if (!S.wordle){ const w = WORDS[dayIndex % WORDS.length]; S.wordle = {answer:w.w, def:w.def, guesses:[], cur:'', done:false, won:false, msg:''}; }
  return S.wordle;
}
function scoreGuess(g, ans){
  const res = Array(5).fill('absent'); const a = ans.split(''); const used = Array(5).fill(false);
  for (let i = 0; i < 5; i++) if (g[i] === a[i]){ res[i] = 'correct'; used[i] = true; }
  for (let i = 0; i < 5; i++){ if (res[i] === 'correct') continue; const k = a.findIndex((c,j) => c === g[i] && !used[j]); if (k > -1){ res[i] = 'present'; used[k] = true; } }
  return res;
}
const WL = {correct:'right letter, right place', present:'in the word, wrong place', absent:'not in the word'};
function wordleBoard(){
  const W = wordleState();
  let rows = '';
  for (let r = 0; r < 6; r++){
    const g = W.guesses[r];
    let tiles = '', sr = '';
    if (g){ const sc = scoreGuess(g, W.answer); tiles = g.split('').map((c,i) => `<div class="tile hex ${sc[i]}">${c}</div>`).join(''); sr = `<span class="sr-only">Guess ${r + 1}: ${g.split('').map((c,i) => `${c} ${WL[sc[i]]}`).join(', ')}.</span>`; }
    else if (r === W.guesses.length && !W.done){ tiles = Array.from({length:5}, (_,i) => `<div class="tile hex ${W.cur[i] ? 'filled' : ''}">${W.cur[i] || ''}</div>`).join(''); }
    else tiles = Array.from({length:5}, () => '<div class="tile hex"></div>').join('');
    rows += `<div class="wrow" aria-hidden="${g ? 'false' : 'true'}">${g ? `<span aria-hidden="true" style="display:contents">${tiles}</span>${sr}` : tiles}</div>`;
  }
  const states = {};
  W.guesses.forEach(g => scoreGuess(g, W.answer).forEach((s,i) => { const c = g[i]; const rank = {correct:3,present:2,absent:1}; if (!states[c] || rank[s] > rank[states[c]]) states[c] = s; }));
  const kb = ['QWERTYUIOP','ASDFGHJKL','+ZXCVBNM-'].map(row => `<div>${row.split('').map(k => k === '+' ? `<button class="wide" data-act="wk" data-k="Enter">Enter</button>` : k === '-' ? `<button class="wide" data-act="wk" data-k="Backspace" aria-label="Delete letter">Delete</button>` : `<button class="${states[k] || ''}" data-act="wk" data-k="${k}" aria-label="${k}${states[k] ? ', ' + WL[states[k]] : ''}">${k}</button>`).join('')}</div>`).join('');
  return `<div class="wordle" role="group" aria-label="Guesses">${rows}</div>
    <p role="status" class="small" style="text-align:center;min-height:1.5em;font-weight:700">${esc(W.msg)}</p>
    ${W.done ? `<div class="panel" style="max-width:520px;margin:0 auto;text-align:center"><h2>${W.won ? 'Nice work' : 'Today\'s word'}: ${W.answer}</h2><p>${esc(W.answer[0] + W.answer.slice(1).toLowerCase())} is ${esc(W.def)}</p><a class="btn btn-primary" href="#/intern/boost">Back to today's games</a></div>` : `<div class="kbd" aria-label="Keyboard">${kb}</div>`}
    <div class="legend" style="margin-top:16px"><span><i class="hex" style="background:var(--mint)"></i>Right letter, right place</span><span><i class="hex" style="background:var(--honey)"></i>In the word, wrong place</span><span><i class="hex" style="background:#8C9AAB"></i>Not in the word</span></div>`;
}
function wordleView(){
  return `<a class="back" href="#/intern/boost">${icon('left')}Daily Career Boost</a><div class="pagehead"><div><h1>Career Wordle</h1><p>Guess the five-letter workplace word. You have six tries. Type on your keyboard or use the keys below.</p></div></div><div id="wordle">${wordleBoard()}</div>`;
}
function wordleKey(k){
  const W = wordleState(); if (W.done) return;
  W.msg = '';
  if (k === 'Enter'){
    if (W.cur.length < 5){ W.msg = 'Enter five letters'; }
    else {
      W.guesses.push(W.cur); W.cur = '';
      if (W.guesses.at(-1) === W.answer){ W.done = true; W.won = true; W.msg = `Solved in ${W.guesses.length} ${W.guesses.length === 1 ? 'try' : 'tries'}`; finishGame('wordle', 30); }
      else if (W.guesses.length === 6){ W.done = true; W.msg = 'Out of tries. Here is today\'s word.'; finishGame('wordle', 10); }
    }
  } else if (k === 'Backspace'){ W.cur = W.cur.slice(0, -1); }
  else if (/^[A-Z]$/.test(k) && W.cur.length < 5){ W.cur += k; }
  const box = $('#wordle'); if (box) box.innerHTML = wordleBoard();
}
ACT.wk = el => { wordleKey(el.dataset.k); const b = $(`[data-act=wk][data-k="${el.dataset.k}"]`); if (b) b.focus(); };
document.addEventListener('keydown', e => {
  if (!$('#wordle') || $('#modal-root').innerHTML) return;
  if (e.target.matches('input,textarea,select')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter' && e.target.closest('button')) return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (k === 'Enter' || k === 'Backspace' || /^[A-Z]$/.test(k)){ e.preventDefault(); wordleKey(k); }
});

function postView(){

  ];

INPUT.draft = el => { S.draft[el.dataset.k] = el.value; const p = $('#post-preview'); if (p) p.innerHTML = postPreview(); };
ACT['post-back'] = () => { S.postStep--; render(); };
ACT['post-save'] = () => { saveDraft('draft'); toast('Draft saved'); go('#/employer/listings'); };
function saveDraft(statusVal){
  const D = S.draft; const j = draftAsJob(D);
  const existing = D.id ? job(D.id) : null;
  const rec = {...j, id:existing ? existing.id : uid('j'), status:statusVal, views:existing ? existing.views : 0, posted:'', submitted:todayISO()};
  if (existing) Object.assign(existing, rec); else S.jobs.push(rec);
  delete S.returned[rec.id];
  S.draft = null; S.postStep = 0;
  return rec;
}
FORM.post = f => {
  const D = S.draft; const st = S.postStep;
  const need = [['title','sector','summary'],['area','mode','hours','pay','starts','closes'],['duties','needs','skills'],[]][st];
  let first = null;
  const fail = (k, msg) => { const e = $('#d-' + k + '-err'); if (e){ e.textContent = msg; e.hidden = false; } const i = $('#d-' + k); if (i){ i.setAttribute('aria-invalid','true'); first = first || i; } };
  $$('.err', f).forEach(e => e.hidden = true); $$('[aria-invalid]', f).forEach(e => e.removeAttribute('aria-invalid'));
  need.forEach(k => { if (!String(D[k]).trim()) fail(k, 'Fill in this field'); });
  if (st === 1){
    if (D.pay && +D.pay < NLW) fail('pay', `Pay must be at least £${NLW} an hour, the National Living Wage`);
    if (D.hours && (+D.hours < 15 || +D.hours > 37.5)) fail('hours', 'Enter between 15 and 37.5 hours');
    if (D.closes && d(D.closes) <= TODAY) fail('closes', 'The closing date must be in the future');
    if (D.starts && D.closes && d(D.starts) <= d(D.closes)) fail('starts', 'The start date must be after the closing date');
  }
  if (first){ first.focus(); return; }
  if (st < 3){ S.postStep++; render(); return; }
  const rec = saveDraft('pending');
  toast('Submitted for approval. We will review it within two working days.');
  go('#/employer/listings');
};

/* Charts: single series, one hue, rounded data-ends, hover and focus tooltips */
function columnChart(data, {label, unit='applications'} = {}){
  const W = 640, H = 240, padL = 34, padB = 28, padT = 26, max = Math.ceil(Math.max(...data.map(x => x.n)) / 10) * 10;
  const bw = (W - padL - 10) / data.length, barW = Math.min(36, bw * .55);
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const peak = data.reduce((m,x,i) => x.n > data[m].n ? i : m, 0);
  const ticks = [0, max / 2, max];
  return `<div class="chart" style="position:relative"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${ticks.map(t => `<line x1="${padL}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}" stroke="#E3E9F0" stroke-width="1"/><text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    ${data.map((x,i) => { const cx = padL + bw * i + bw / 2, top = y(x.n), h = H - padB - top, partial = i === data.length - 1;
      const r = Math.min(4, h);
      return `<g class="bar" tabindex="0" data-tip="${esc(x.w)}${partial ? ' (week so far)' : ''}: ${x.n} ${unit}" aria-label="Week of ${esc(x.w)}${partial ? ', so far' : ''}: ${x.n} ${unit}">
        <rect x="${cx - bw / 2}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent"/>
        <path d="M${cx - barW / 2} ${H - padB}V${top + r}Q${cx - barW / 2} ${top} ${cx - barW / 2 + r} ${top}H${cx + barW / 2 - r}Q${cx + barW / 2} ${top} ${cx + barW / 2} ${top + r}V${H - padB}Z" fill="${partial ? '#9FB2C6' : '#0E2A47'}"/>
        ${i === peak || partial ? `<text class="val" x="${cx}" y="${top - 6}" text-anchor="middle">${x.n}</text>` : ''}
        <text x="${cx}" y="${H - 9}" text-anchor="middle">${esc(x.w)}</text></g>`; }).join('')}
    <line x1="${padL}" x2="${W - 6}" y1="${H - padB}" y2="${H - padB}" stroke="#B9C6D4"/>
  </svg><div class="tip" role="tooltip" hidden style="position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:.85rem;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)"></div>
  <p class="small muted" style="margin:6px 0 0">The lighter bar is the current week, still in progress.</p></div>`;
}
function hbars(data){
  const max = Math.max(...data.map(x => x.n));
  return data.map(x => `<div class="bar-h"><span>${esc(x.s)}</span><span class="b"><i style="width:${x.n / max * 100}%"></i></span><span class="n">${x.n}</span></div>`).join('');
}
AFTER.push(() => {
  $$('.chart').forEach(ch => {
    const tip = $('.tip', ch); if (!tip) return;
    const show = g => { const r = g.getBoundingClientRect(), c = ch.getBoundingClientRect(); tip.textContent = g.dataset.tip; tip.hidden = false; tip.style.left = (r.left - c.left + r.width / 2) + 'px'; tip.style.top = (g.querySelector('path').getBoundingClientRect().top - c.top) + 'px'; };
    $$('.bar', ch).forEach(g => { g.addEventListener('mouseenter', () => show(g)); g.addEventListener('focus', () => show(g)); g.addEventListener('mouseleave', () => tip.hidden = true); g.addEventListener('blur', () => tip.hidden = true); });
  });
});

function listingChecks(j){
  const e = emp(j.emp);
  const text = [j.summary, ...j.duties, ...j.needs].join(' ');
  return [
    {ok:e.verified, t:'Employer is verified', fix:`${e.name} has not been verified yet`},
    {ok:j.pay >= NLW, t:`Pay is at least £${NLW} an hour (National Living Wage)`, fix:`Pay is ${money(j.pay)} an hour, below the National Living Wage`},
    {ok:daysUntil(j.closes) >= 7, t:'Open for at least 7 days', fix:'Closes in under 7 days'},
    {ok:j.duties.length > 0 && j.needs.length > 0, t:'Duties and requirements filled in', fix:'Missing duties or requirements'},
    {ok:d(j.starts) > d(j.closes), t:'Start date is after the closing date', fix:'Start date is before the closing date'},
    {ok:!/@|https?:/.test(text), t:'Applications go through Talent Hive, not email', fix:'Listing text includes an email address or link'}
  ];
}

  <div class="pagehead"><div><h1>Review: ${esc(j.title)}</h1><p>${esc(e.name)}. Submitted ${fmtLong(j.submitted)}.</p></div>${status(j.status, j.status === 'pending' ? 'Waiting for approval' : j.status === 'live' ? 'Live' : 'Returned')}</div>

      <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${logo(e)}<div><h2 style="margin:0">${esc(j.title)}</h2><div class="muted small">${esc(e.name)}, ${esc(j.area)}</div></div></div>
      <dl class="facts"><div><dt>Pay</dt><dd>${money(j.pay)} an hour</dd></div><div><dt>Hours</dt><dd>${j.hours} a week</dd></div><div><dt>Length</dt><dd>${j.weeks} weeks</dd></div><div><dt>Location</dt><dd>${esc(j.area)}, ${esc(j.mode.toLowerCase())}</dd></div><div><dt>Starts</dt><dd>${fmt(j.starts)}</dd></div><div><dt>Closes</dt><dd>${fmt(j.closes)}</dd></div></dl>
      <div class="prose"><p>${esc(j.summary)}</p><h2>What you will do</h2><ul>${j.duties.map(x => `<li>${esc(x)}</li>`).join('')}</ul><h2>What you need</h2><ul>${j.needs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      ${j.questions.length ? `<h2>Screening questions</h2><ul>${j.questions.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>
    </section>
    <aside class="stack">
      <section class="panel"><h2>Automatic checks</h2><ul class="checklist">${checks.map(c => `<li class="${c.ok ? 'ok' : 'bad'}">${icon(c.ok ? 'check' : 'alert')}<span>${esc(c.ok ? c.t : c.fix)}</span></li>`).join('')}</ul></section>
      ${j.status === 'pending' ? `<section class="panel"><h2>Decision</h2>
        ${blockers.length ? `<p class="small" style="color:var(--red);font-weight:700">${blockers.length} ${blockers.length === 1 ? 'check needs' : 'checks need'} attention. Return the listing with comments, or fix the issue first.</p>` : '<p class="small">Everything checks out.</p>'}

        <button class="btn btn-ghost" style="width:100%" data-act="return" data-id="${j.id}">Return with comments</button></section>` : ''}
    </aside>
  </div>`;
}

      <details style="margin-top:10px"><summary class="small" style="cursor:pointer;color:var(--link);font-weight:700">Show as a table</summary><table class="table" style="margin-top:8px"><thead><tr><th>Week starting</th><th class="num">Applications</th></tr></thead><tbody>${WEEKLY_APPS.map(x => `<tr><td>${x.w}</td><td class="num">${x.n}</td></tr>`).join('')}</tbody></table></details></section>
    <section class="panel"><h2>Placements by sector</h2>${hbars(PLACEMENTS_BY_SECTOR)}</section>
  </div>
  <section class="panel" style="margin-top:20px"><h2>Funnel this cohort</h2><div class="table-wrap"><table class="table"><thead><tr><th>Stage</th><th class="num">People</th><th class="num">Share of sign-ups</th></tr></thead><tbody>
    ${[['Signed up',527],['Completed profile and CV',402],['Applied for at least one role',288],['Interviewed',131],['Placed',59]].map(([s,n]) => `<tr><td>${s}</td><td class="num">${n}</td><td class="num">${Math.round(n / 527 * 100)}%</td></tr>`).join('')}
  </tbody></table></div><p class="small muted" style="margin:10px 0 0">Sample figures for the demo.</p></section>`;
}
ACT.csv = () => {
  const lines = ['Section,Label,Value', ...WEEKLY_APPS.map(x => `Applications per week,${x.w},${x.n}`), ...PLACEMENTS_BY_SECTOR.map(x => `Placements by sector,${x.s},${x.n}`)];
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'talent-hive-report-sample.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('Report downloaded');
};

/* Content */
function contentView(){
  return `<div class="pagehead"><div><h1>News and events</h1><p>Updates and sessions for interns and employers. Job listings live in their own approval queue, never here.</p></div><button class="btn btn-primary" data-act="addevent">${icon('plus')}Add event</button></div>
  <section class="panel"><h2>Events</h2>${S.events.map(ev => { const x = d(ev.date); return `<div class="listitem"><div class="date hex"><b>${x.getDate()}</b><span>${MONTHS[x.getMonth()]}</span></div><div class="grow"><b>${esc(ev.title)}</b><div class="small muted">${esc(ev.time)}. ${esc(ev.where)}</div></div><span class="chip">${esc(ev.type)}</span></div>`; }).join('')}</section>
  <section class="panel"><h2>News</h2>
    <div class="listitem"><div class="grow"><b>Welcome to the winter 2026 cohort</b><div class="small muted">Published 2 November. Seen by 412 interns</div></div>${status('live','Published')}</div>
    <div class="listitem"><div class="grow"><b>New: track your applications in one place</b><div class="small muted">Published 5 October. Seen by 498 interns</div></div>${status('live','Published')}</div>
    <div class="listitem"><div class="grow"><b>Christmas opening hours</b><div class="small muted">Draft</div></div>${status('draft','Draft')}</div>
  </section>`;
}
ACT.addevent = () => openModal(`<form data-form="addevent"><header><h2>Add an event</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">${icon('x')}</button></header>
  <div class="field"><label for="ev-t">Title</label><input id="ev-t" name="title" type="text" value="CV clinic"></div>
  <div class="row"><div class="field"><label for="ev-d">Date</label><input id="ev-d" name="date" type="date" value="2027-01-20"></div><div class="field"><label for="ev-time">Time</label><input id="ev-time" name="time" type="text" value="10:00 to 11:00"></div></div>
  <div class="row"><div class="field"><label for="ev-w">Where</label><input id="ev-w" name="where" type="text" value="Online"></div><div class="field"><label for="ev-type">Type</label><select id="ev-type" name="type"><option>Online</option><option>In person</option></select></div></div>
  <footer><button type="button" class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary">Publish event</button></footer></form>`, {label:'Add an event'});
FORM.addevent = f => { if (!f.title.value.trim() || !f.date.value) return; S.events.push({id:uid('ev'), title:f.title.value.trim(), date:f.date.value, time:f.time.value, where:f.where.value, type:f.type.value}); S.events.sort((a,b) => d(a.date) - d(b.date)); closeModal(); toast('Event published. Interns can book it now.'); render({keepScroll:true}); };

render();
maybeIntro();

</script>
</body>
</html>
