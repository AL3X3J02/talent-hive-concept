<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Hive demo</title>
<meta name="description" content="A working demo by Alexej Zhukov of a redesigned Talent Hive internship platform in Cambridgeshire and Peterborough. Sample data only; not an official CPCA website.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Talent Hive demo by Alexej Zhukov">
<meta property="og:description" content="A clickable demo by Alexej Zhukov: a jobs board, applicant pipeline and approvals for interns, employers and the CPCA team. Sample data only.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://al3x3j02.github.io/talent-hive-concept/preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Talent Hive demo: design tokens
   ========================================================= */
:root{
  --ink:#0F1222;
  --ink-2:#30354A;
  --muted:#5D6375;
  --blue:#2E3BFF;
  --blue-600:#2330E0;
  --blue-50:#EEF0FF;
  --blue-100:#DDE1FF;
  --link:#2E3BFF;
  --violet:#5A4BF2;
  --honey:#FFB547;
  --honey-50:#FFF4E0;
  --honey-ink:#8A4B00;
  --mint:#1FA463;
  --mint-50:#E3F7EC;
  --mint-ink:#11683D;
  --red:#D9362B;
  --red-50:#FDECEA;
  --pink-50:#FCE4F8;--pink-ink:#9A1F85;
  --lime-50:#EEFAD0;--lime-ink:#4A6600;
  --peach-50:#FFE9DC;--peach-ink:#A8440E;
  --lav-50:#ECEBFF;--lav-ink:#4535C4;
  --surface:#F4F5F8;
  --surface-2:#ECEEF3;
  --line:#E4E6ED;
  --dash:#CDD2DD;
  --white:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(15,18,34,.05),0 1px 1px rgba(15,18,34,.03);
  --shadow:0 1px 2px rgba(15,18,34,.04),0 8px 24px -8px rgba(15,18,34,.10);
  --shadow-lg:0 24px 60px -20px rgba(15,18,34,.30);
  --focus:0 0 0 2px #fff,0 0 0 4px var(--blue);
  --font:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:var(--font);
  --body:var(--font);
  --r-panel:18px;--r-card:14px;--r-ctl:12px;
  --hatch:repeating-linear-gradient(135deg,rgba(46,59,255,.16) 0 2px,transparent 2px 7px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:1rem;line-height:1.55;color:var(--ink);background:var(--surface);font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0 0 .5em;letter-spacing:-.025em;color:var(--ink);font-weight:600}
h1{font-size:clamp(2rem,3.6vw,2.75rem)}
h2{font-size:1.5rem}
h3{font-size:1.15rem;letter-spacing:-.015em}
h4{font-size:1rem}
p{margin:0 0 1em}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--blue-600)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
[tabindex="-1"]:focus{outline:none;box-shadow:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{top:52px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.nowrap{white-space:nowrap}
.hex{clip-path:none}

/* Demo bar */
.demobar{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff;font-size:.85rem;display:flex;align-items:center;gap:12px;padding:7px 16px;flex-wrap:wrap}
.demobar strong{font-weight:600;background:var(--blue);padding:1px 9px;border-radius:999px}
.demobar .note{opacity:.7}
.demobar .roles{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
.demobar .roles span{opacity:.6;margin-right:4px}
.demobar button{background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:4px 13px;cursor:pointer;transition:background .2s,border-color .2s}
.demobar button:hover{border-color:#fff}
.demobar button[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--ink);font-weight:600}
.demobar .reset{border-style:dashed}
.demobar .about{border:0;text-decoration:underline;text-underline-offset:3px;padding:3px 4px;opacity:.85}
.demobar .tourbtn{background:var(--blue);border-color:var(--blue);font-weight:600}
.demobar .tourbtn:hover{background:var(--blue-600)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:550;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .2s,border-color .2s,transform .12s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(46,59,255,.6)}
.btn-primary:hover{background:var(--blue-600);color:#fff}
.btn-honey{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.btn-honey:hover{background:#F1F2FF;color:var(--ink)}
.btn-ghost{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#B9BFCD;color:var(--ink)}
.btn-quiet{background:transparent;color:var(--blue);padding:8px 12px}
.btn-quiet:hover{background:var(--blue-50);color:var(--blue-600)}
.btn-danger{background:var(--white);border-color:#F2C2BE;color:var(--red)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#262A40;color:#fff}
.btn-sm{padding:6px 13px;font-size:.875rem}
.btn-lg{padding:14px 26px;font-size:1rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.icon-btn{background:transparent;border:0;padding:8px;border-radius:10px;cursor:pointer;color:var(--ink-2);display:inline-flex}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"] svg{fill:var(--blue);stroke:var(--blue)}

/* Forms */
label{font-weight:550;display:block;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:.85rem;display:block;margin-top:2px}
.field{margin-bottom:18px}
input[type=text],input[type=search],input[type=email],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;background:var(--white);border:1px solid #D3D7E1;border-radius:var(--r-ctl);padding:10px 13px;min-height:44px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(46,59,255,.14);outline:none}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:19px;height:19px;margin-top:2px;accent-color:var(--blue)}
.row{display:flex;gap:16px}
.row>*{flex:1}
.err{color:var(--red);font-weight:550;font-size:.88rem;margin-top:6px}

/* Chips and status */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:.8rem;line-height:1.5;white-space:nowrap}
.chip svg{width:13px;height:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:550;font-size:.78rem;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-applied,.st-new,.st-live{background:var(--blue-50);color:var(--blue-600)}
.st-viewed,.st-draft{background:var(--surface-2);color:var(--ink-2)}
.st-shortlisted,.st-pending{background:var(--honey-50);color:var(--honey-ink)}
.st-interview{background:var(--pink-50);color:var(--pink-ink)}
.st-offer,.st-placed,.st-approved{background:var(--mint-50);color:var(--mint-ink)}
.st-notprogressed,.st-returned,.st-closed{background:var(--red-50);color:var(--red)}
.tag-new{background:var(--lime-50);color:var(--lime-ink);font-weight:600;font-size:.72rem;padding:2px 8px;border-radius:999px;vertical-align:2px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--mint-50);color:var(--mint-ink)}
.delta.down{background:var(--peach-50);color:var(--peach-ink)}

/* Brand */
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem;letter-spacing:-.04em;flex:none;box-shadow:inset 0 -6px 12px rgba(0,0,0,.12)}
.brand .wm b{display:block;font-size:1.05rem;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.brand small{display:block;font-size:.7rem;color:var(--muted);line-height:1.2;font-weight:400}
.concept-tag{font-size:.66rem;font-weight:600;letter-spacing:0;background:var(--blue-50);color:var(--blue-600);border-radius:999px;padding:2px 7px;margin-left:2px;align-self:flex-start}

/* Public header */
.pub-header{background:var(--white);border-bottom:1px solid var(--line);position:relative;z-index:5}
.pub-header .inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:14px 28px}
.pub-nav{display:flex;gap:2px;margin-left:16px}
.pub-nav a{padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:.95rem}
.pub-nav a:hover,.pub-nav a[aria-current="page"]{background:var(--surface);color:var(--ink)}
.pub-header .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.pub-header.on-blue{background:transparent;border-color:rgba(255,255,255,.18);position:absolute;left:0;right:0}
.pub-header.on-blue .brand,.pub-header.on-blue .pub-nav a{color:#fff}
.pub-header.on-blue .brand small{color:rgba(255,255,255,.7)}
.pub-header.on-blue .pub-nav a:hover{background:rgba(255,255,255,.12)}
.pub-header.on-blue .brand .mark{background:#fff;color:var(--blue)}
.pub-header.on-blue .concept-tag{background:rgba(255,255,255,.16);color:#fff}
.pub-header.on-blue .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.pub-header.on-blue .btn-primary{background:#fff;color:var(--ink);box-shadow:none}

/* Hero */
.hero{position:relative;overflow:hidden;background:#1B23E6;color:#fff;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-20%;z-index:-2;background:
  radial-gradient(40% 50% at 18% 30%,rgba(122,140,255,.75),transparent 70%),
  radial-gradient(35% 45% at 78% 65%,rgba(126,84,255,.65),transparent 70%),
  radial-gradient(50% 60% at 60% 10%,rgba(40,120,255,.7),transparent 70%),
  linear-gradient(160deg,#2433FF,#1418C4 70%);
  animation:drift 22s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(420px 420px at var(--mx,70%) var(--my,30%),rgba(255,255,255,.16),transparent 60%);transition:background .1s}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(-4%,3%,0) rotate(6deg)}}
.hero .inner{max-width:1240px;margin:0 auto;padding:128px 28px 56px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:end;position:relative}
.hero .frame{position:absolute;inset:96px 28px 28px;pointer-events:none}
.hero .frame i{position:absolute;width:14px;height:14px;border-color:rgba(255,255,255,.55);border-style:solid;border-width:0}
.hero .frame i:nth-child(1){top:0;left:0;border-top-width:1px;border-left-width:1px}
.hero .frame i:nth-child(2){top:0;right:0;border-top-width:1px;border-right-width:1px}
.hero .frame i:nth-child(3){bottom:0;left:0;border-bottom-width:1px;border-left-width:1px}
.hero .frame i:nth-child(4){bottom:0;right:0;border-bottom-width:1px;border-right-width:1px}
.hero .kicker{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:rgba(255,255,255,.8);margin-bottom:18px}
.hero .kicker b{font-weight:400;font-size:1.1rem}
.hero h1{color:#fff;font-weight:300;font-size:clamp(2.8rem,6.4vw,5.6rem);line-height:.98;letter-spacing:-.045em;margin:0 0 .3em;max-width:11ch}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(28px);animation:rise .9s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.hero .lede{font-size:1.08rem;color:rgba(255,255,255,.82);max-width:40ch;margin-bottom:22px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero .ctas .btn-primary{background:#fff;color:var(--ink);box-shadow:none}
.hero .ctas .btn-primary:hover{background:#EEF0FF}
.hero .ctas .btn-dark{background:var(--ink)}
.hero-cards{position:relative;height:430px}
.fcard{position:absolute;background:rgba(255,255,255,.97);color:var(--ink);border-radius:16px;padding:14px 16px;box-shadow:0 30px 60px -20px rgba(6,10,80,.55);animation:float 7s ease-in-out infinite;backdrop-filter:blur(8px)}
.fcard:nth-child(2){animation-delay:-2s;animation-duration:8s}
.fcard:nth-child(3){animation-delay:-4s;animation-duration:6.5s}
.fcard:nth-child(4){animation-delay:-1s;animation-duration:9s}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(var(--r,0deg))}}
.fcard .fc-top{display:flex;gap:10px;align-items:center}
.fcard .fc-t{font-weight:600;font-size:.95rem;line-height:1.2}
.fcard .fc-s{font-size:.78rem;color:var(--muted)}
.fcard.pinkpill{background:#F7A8EE;border-radius:999px;padding:10px 16px;display:flex;gap:10px;align-items:center}
.fcard.pinkpill .cal{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;line-height:1}
.fcard.stat .big{font-size:2.2rem;font-weight:300;letter-spacing:-.04em;line-height:1}
.hbar{height:12px;border-radius:4px;background:var(--hatch),var(--blue-50);overflow:hidden;margin-top:8px}
.hbar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.hero-foot{position:relative;max-width:1240px;margin:0 auto;padding:0 28px 36px}
.searchbar{color:var(--ink);display:flex;gap:6px;background:#fff;padding:6px;border-radius:999px;max-width:760px;box-shadow:0 30px 60px -24px rgba(6,10,80,.6)}
.searchbar input,.searchbar select{border:0;background:transparent;min-height:48px;border-radius:999px}
.searchbar input{padding-left:20px}
.searchbar select{max-width:200px;border-left:1px solid var(--line);border-radius:0}
.searchbar .btn{min-height:48px;white-space:nowrap}
.hero .closing{margin-top:14px;color:rgba(255,255,255,.8);font-size:.92rem}
.hero .closing a{color:#fff}
.hero-sectors{display:flex;border-top:1px dashed rgba(255,255,255,.35);margin-top:28px;padding-top:12px;gap:0;font-size:.82rem;color:rgba(255,255,255,.75)}
.hero-sectors span{flex:1}

/* Logo marquee */
.marquee{background:#fff;border-bottom:1px solid var(--line);overflow:hidden;padding:22px 0;position:relative}
.marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:1}
.marquee::before{left:0;background:linear-gradient(90deg,#fff,transparent)}
.marquee::after{right:0;background:linear-gradient(-90deg,#fff,transparent)}
.marquee .lbl{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:14px}
.marquee .track{display:flex;gap:56px;width:max-content;animation:marq 40s linear infinite}
.marquee:hover .track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.wordmark{display:flex;align-items:center;gap:8px;color:#6E7486;font-size:1.15rem;white-space:nowrap;font-weight:600;letter-spacing:-.02em}
.wordmark i{width:22px;height:22px;border-radius:6px;background:#C9CED9;display:inline-block}
.wordmark.serif{font-family:Georgia,serif;font-weight:400;letter-spacing:0}
.wordmark.thin{font-weight:300;letter-spacing:.02em}
.wordmark.round i{border-radius:50%}

/* Public sections */
.section{max-width:1240px;margin:0 auto;padding:72px 28px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-size:.88rem;font-weight:500;margin-bottom:12px}
.eyebrow::before{content:"+";font-weight:300;font-size:1.1rem}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.section-head p{margin:0;color:var(--muted)}
.bigtitle{font-size:clamp(2rem,4vw,3.2rem);font-weight:500;letter-spacing:-.04em;line-height:1.02;margin:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:end;margin-bottom:32px}
.split p{color:var(--muted);font-size:1.05rem;max-width:46ch;margin:0}
.sectors{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px dashed var(--dash);border-left:1px dashed var(--dash)}
.sector{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:190px;padding:20px;border-right:1px dashed var(--dash);border-bottom:1px dashed var(--dash);background:#fff;text-align:left;cursor:pointer;border-top:0;border-left:0;overflow:hidden;color:var(--ink);font:inherit;isolation:isolate}
.sector::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#3442FF,#1B23E6);z-index:-1;transform:translateY(101%);transition:transform .45s var(--ease)}
.sector:hover::before,.sector:focus-visible::before{transform:none}
.sector:hover,.sector:focus-visible{color:#fff}
.sector svg{width:30px;height:30px;stroke-width:1.4;color:var(--ink-2);transition:color .3s}
.sector:hover svg,.sector:focus-visible svg{color:#fff}
.sector .nm{font-size:1.05rem;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.sector .ct{font-size:.85rem;color:var(--muted);transition:color .3s}
.sector:hover .ct,.sector:focus-visible .ct{color:rgba(255,255,255,.8)}
.sector .arr{position:absolute;right:18px;bottom:18px;opacity:0;transform:translateX(-8px);transition:all .35s var(--ease)}
.sector:hover .arr,.sector:focus-visible .arr{opacity:1;transform:none}
.sector .arr svg{width:20px;height:20px;color:#fff}
.sector:focus-visible{box-shadow:none;outline:2px solid #fff;outline-offset:-6px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0;margin:0;counter-reset:s}
.steps li{list-style:none;position:relative;background:linear-gradient(180deg,#fff,#F3F5FF);border-radius:18px;padding:96px 22px 22px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}
.steps li::before{counter-increment:s;content:"0" counter(s);position:absolute;top:10px;right:18px;font-size:4.4rem;font-weight:600;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px rgba(46,59,255,.18);line-height:1}
.steps li h3{margin-bottom:6px}
.steps li p{margin:0}
.blueband{background:linear-gradient(180deg,#2E6BFF,#3D86FF);color:#fff;position:relative;overflow:hidden}
.blueband .eyebrow{color:rgba(255,255,255,.85)}
.blueband .bigtitle{color:#fff}
.blueband .split p{color:rgba(255,255,255,.85)}
.blueband .steps li{background:rgba(255,255,255,.95);color:var(--ink)}
.violetband{background:var(--violet);color:#fff}
.violetband .bigtitle,.violetband h3{color:#fff}
.violetband .eyebrow{color:rgba(255,255,255,.8)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:36px 56px;margin-top:40px}
.stat .n{font-size:3.2rem;font-weight:300;letter-spacing:-.05em;line-height:1}
.stat .n small{font-size:1.3rem;margin-left:2px}
.stat .t{font-size:.9rem;color:rgba(255,255,255,.78);margin:6px 0 10px}
.hatchbar{height:22px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 4px);position:relative}
.hatchbar i{position:absolute;left:0;top:0;bottom:0;background:#fff;width:0;transition:width 1.4s var(--ease)}
.employer-band{background:var(--ink);color:#fff}
.employer-band .section{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center}
.employer-band h2{color:#fff;font-size:clamp(2rem,3.6vw,3rem);font-weight:500;letter-spacing:-.04em}
.employer-band p{color:#B9BDCC}
.employer-band ul{margin:0;padding:0;list-style:none;display:grid;gap:0;border-top:1px dashed rgba(255,255,255,.2)}
.employer-band li{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px dashed rgba(255,255,255,.2)}
.employer-band li svg{flex:none;width:20px;height:20px;color:#8E98FF;margin-top:2px}
.employer-band .btn-honey{background:#fff}
.employer-band .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.pub-footer{background:#fff;border-top:1px solid var(--line)}
.pub-footer .section{padding:40px 28px 28px}
.pub-footer .fgrid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.pub-footer .huge{font-size:clamp(3rem,12vw,10rem);font-weight:600;letter-spacing:-.06em;line-height:.85;color:var(--surface-2);margin-top:32px;user-select:none}

/* Job rows */
.joblist{display:flex;flex-direction:column;gap:10px}
.jobrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:start;background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;text-align:left;width:100%;position:relative;transition:border-color .2s,box-shadow .25s,transform .25s var(--ease)}
.jobrow:hover{border-color:#C9CEDA;box-shadow:var(--shadow);transform:translateY(-1px)}
.jobrow h3{font-size:1.05rem;margin:0 0 2px;font-weight:600}
.jobrow h3 a{color:var(--ink);text-decoration:none}
.jobrow h3 a::after{content:"";position:absolute;inset:0;border-radius:var(--r-card)}
.jobrow .emp{color:var(--muted);margin-bottom:10px;font-size:.92rem}
.jobrow .jside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;position:relative;z-index:1}
.js-top{display:flex;align-items:center;gap:4px;margin:-6px -8px 0 0}
.logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:600;color:#fff;font-size:.92rem;flex:none;letter-spacing:-.02em;box-shadow:inset 0 -8px 14px rgba(0,0,0,.12)}
.logo.lg{width:72px;height:72px;font-size:1.35rem;border-radius:18px}
.match{font-size:.8rem;font-weight:600;color:var(--mint-ink);background:var(--mint-50);padding:2px 8px;border-radius:999px}

/* App shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 40px);background:linear-gradient(to right,#fff 259px,var(--line) 259px,var(--line) 260px,var(--surface) 260px)}
.side{background:var(--white);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:40px;height:calc(100vh - 40px);overflow:auto;display:flex;flex-direction:column}
.side .brand{padding:4px 8px 16px}
.side-search{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;color:var(--muted);cursor:pointer;margin-bottom:16px;font-size:.9rem;text-align:left}
.side-search:hover{border-color:#C9CEDA}
.side-search svg{width:16px;height:16px}
.side-search span{flex:1}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:.94rem;transition:background .15s,color .15s}
.side nav a svg{width:19px;height:19px;flex:none;stroke-width:1.7}
.side nav a:hover{background:var(--surface)}
.side nav a[aria-current="page"]{background:var(--blue);color:#fff;box-shadow:0 8px 18px -8px rgba(46,59,255,.75)}
.side nav a .count{margin-left:auto;background:var(--red-50);color:var(--red);border-radius:999px;font-size:.72rem;font-weight:600;padding:0 7px;line-height:1.6}
.side nav a[aria-current="page"] .count{background:rgba(255,255,255,.22);color:#fff}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:14px 8px 4px;border-top:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-weight:600;font-size:.85rem;flex:none;background:var(--av,#DDE1FF);box-shadow:inset 0 0 0 1px rgba(15,18,34,.06)}
.avatar.lg{width:64px;height:64px;font-size:1.3rem}
.who b{display:block;line-height:1.2;font-weight:600;font-size:.92rem}
.who div span{font-size:.8rem;color:var(--muted)}
.col-main{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 36px 0;max-width:1260px}
.topbar .today{color:var(--muted);font-size:.9rem}
.searchtrigger{display:none}
.tb-actions{margin-left:auto;display:flex;gap:8px}
.tb-btn{position:relative;background:var(--white);border:1px solid var(--line);border-radius:999px;width:42px;height:42px;justify-content:center;align-items:center;padding:0}
.tb-btn:hover{border-color:#C9CEDA;background:#fff}
.tb-btn .aa{font-weight:600;font-size:.95rem;color:var(--ink)}
.badge-dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:.68rem;font-weight:600;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.main{padding:22px 36px 72px;max-width:1260px;width:100%}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.pagehead h1{font-size:1.9rem;margin:0}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-weight:500;text-decoration:none;font-size:.92rem}
.back svg{width:17px;height:17px}

/* Panels */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);padding:22px;box-shadow:var(--shadow-sm)}
.panel h2{font-size:1.1rem;font-weight:600;letter-spacing:-.015em}
.panel+.panel{margin-top:16px}
.grid-2>.panel,.grid-3>.panel,.grid-main>.panel,.grid-main>aside.panel{margin-top:0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.stack>*+*{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--shadow-sm)}
.kpi .l{color:var(--muted);font-size:.85rem;order:-1}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:1.9rem;font-weight:500;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:.76rem;font-weight:600;color:var(--mint-ink);background:var(--mint-50);border-radius:999px;padding:1px 8px;align-self:flex-start}

/* Next step banner */
.nextstep{background:linear-gradient(120deg,#2E3BFF,#5A4BF2);color:#fff;border-radius:var(--r-panel);padding:20px 22px;display:flex;gap:18px;align-items:center;margin-bottom:16px;position:relative;overflow:hidden;isolation:isolate}
.nextstep::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);z-index:-1}
.nextstep h2{color:#fff;margin:0 0 3px;font-size:1.2rem}
.nextstep p{margin:0;color:rgba(255,255,255,.85)}
.nextstep .btn{margin-left:auto;flex:none}
.nextstep .hexdeco{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.16);flex:none;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
.nextstep .hexdeco svg{width:24px;height:24px;color:#fff}

/* Progress */
.meter{height:10px;border-radius:999px;overflow:hidden;background:var(--hatch),var(--blue-50)}
.meter i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .8s var(--ease)}
.meter.honey i{background:linear-gradient(90deg,#2E3BFF,#7C5CFF)}

/* Tables */
.table{width:100%;border-collapse:collapse;font-size:.93rem}
.table th{text-align:left;font-weight:500;color:var(--muted);font-size:.82rem;padding:10px 12px;border-bottom:1px solid var(--line)}
.table td{padding:12px;border-bottom:1px dashed var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .15s}
.table tbody tr:hover{background:#FAFBFD}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;position:relative}

/* Jobs board */
.board{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.filters{background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);padding:18px;position:sticky;top:60px}
.filters fieldset{border:0;padding:0 0 16px;margin:0 0 16px;border-bottom:1px dashed var(--line)}
.filters fieldset:last-child{border-bottom:0;margin:0;padding:0}
.filters legend{font-weight:600;margin-bottom:8px;font-size:.92rem}
.filters .check{margin-bottom:6px;font-size:.93rem}
.resultbar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.resultbar select{width:auto;min-height:38px;border-radius:999px}
.boardsearch{display:flex;gap:8px;margin-bottom:16px}
.boardsearch input{min-height:50px;border-radius:999px;padding-left:20px}
.empty{text-align:center;padding:40px 20px;background:var(--white);border:1px dashed var(--dash);border-radius:var(--r-panel)}

/* Job detail */
.jobhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px}
.jobhead h1{font-size:2.1rem;margin-bottom:4px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px dashed var(--dash);border-radius:var(--r-card);overflow:hidden;margin-bottom:24px;background:#fff}
.facts div{padding:14px 16px;border-right:1px dashed var(--dash);border-bottom:1px dashed var(--dash)}
.facts div:nth-child(3n){border-right:0}
.facts div:nth-last-child(-n+3){border-bottom:0}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.prose h2{font-size:1.2rem;margin-top:1.4em}
.prose ul{padding-left:1.2em}
.prose li{margin-bottom:6px}
.applybox{position:sticky;top:60px}
.applybox .deadline{font-size:.93rem;margin:8px 0 16px}

/* Modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(15,18,34,.4);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:var(--white);border-radius:22px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;box-shadow:var(--shadow-lg);animation:pop .25s var(--ease)}
.modal header,.drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal header>div,.drawer header>div{min-width:0}
.modal h2,.drawer h2{margin:0}
.modal footer,.drawer footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.drawer-ov{justify-content:flex-end;padding:0;align-items:stretch}
.drawer{background:var(--white);width:min(580px,100%);height:100%;overflow:auto;padding:26px;box-shadow:-20px 0 60px rgba(15,18,34,.18);animation:slidein .3s var(--ease)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.cvchip{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-card);padding:12px;background:var(--surface)}
.cvchip svg{width:28px;height:28px;color:var(--blue)}

/* Toast */
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 18px 11px 14px;border-radius:999px;display:flex;gap:10px;align-items:center;box-shadow:0 14px 40px -10px rgba(15,18,34,.5);font-weight:500;font-size:.93rem;animation:pop .3s var(--ease)}
.toast svg{width:18px;height:18px;color:#fff;background:var(--mint);border-radius:50%;padding:3px;stroke-width:3}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
body:has(.tray) #toast-root{bottom:86px}

/* Tracker */
.track{display:flex;margin:14px 0 4px;list-style:none;padding:0}
.track li{flex:1 1 0;min-width:0;white-space:nowrap;position:relative;text-align:center;font-size:.76rem;color:var(--muted);padding-top:20px}
.track li::before{content:"";position:absolute;top:5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--white);border:2px solid #C3C9D6;z-index:1}
.track li::after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line)}
.track li:first-child::after{display:none}
.track li.done{color:var(--ink-2)}
.track li.done::before{background:var(--blue);border-color:var(--blue)}
.track li.done::after{background:var(--blue)}
.track li.now{color:var(--ink);font-weight:600}
.track li.now::before{background:#fff;border:3px solid var(--blue);width:14px;height:14px;margin-left:-7px;top:3px;box-shadow:0 0 0 5px rgba(46,59,255,.15)}
.track li.now::after{background:var(--blue)}
.appcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;box-shadow:var(--shadow-sm)}
.appcard+.appcard{margin-top:12px}
.appcard .top{display:flex;gap:14px;align-items:flex-start}
.appcard .top .status{margin-left:auto}
.timeline{list-style:none;margin:12px 0 0;border-left:2px dashed var(--line);padding-left:16px}
.timeline li{position:relative;margin-bottom:10px;font-size:.9rem}
.timeline li::before{content:"";position:absolute;left:-22px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--blue)}

/* CV builder */
.cvgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.cvpaper{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:36px 38px;box-shadow:var(--shadow);position:sticky;top:60px;font-size:.9rem}
.cvpaper h2{font-size:1.7rem;font-weight:600;margin-bottom:2px}
.cvpaper h3{font-size:.8rem;color:var(--blue);font-weight:600;letter-spacing:.02em;border-bottom:1px dashed var(--dash);padding-bottom:6px;margin:20px 0 8px}
.cvpaper .role{font-weight:600}
.cvpaper .badges{display:flex;flex-wrap:wrap;gap:6px}
.cvexp{border:1px dashed var(--dash);border-radius:var(--r-card);padding:14px;margin-bottom:12px;background:#FBFBFD}

/* Badges path */
.path{display:flex;align-items:center;flex-wrap:wrap;margin:14px 0}
.node{display:flex;flex-direction:column;align-items:center;gap:8px;width:130px;text-align:center;font-size:.84rem}
.node .hex{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:1px dashed var(--dash)}
.node .hex svg{width:26px;height:26px}
.node.earned .hex{background:var(--blue);color:#fff;border:0;box-shadow:0 10px 20px -10px rgba(46,59,255,.8)}
.node.next .hex{background:var(--blue-50);color:var(--blue);border:2px solid var(--blue)}
.link{flex:1;min-width:20px;height:2px;background:repeating-linear-gradient(90deg,var(--dash) 0 6px,transparent 6px 10px);margin-top:-36px}
.link.done{background:var(--blue)}

/* Games */
.boosthead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.streak{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px}
.streak .hex{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,#FF8A3D,#FF4D6D);color:#fff;display:grid;place-items:center;font-weight:700}
.gamecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gamecard{background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);padding:20px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s}
.gamecard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gamecard:nth-child(1){background:linear-gradient(180deg,#fff 50%,#EEF0FF)}
.gamecard:nth-child(2){background:linear-gradient(180deg,#fff 50%,#FCE4F8)}
.gamecard:nth-child(3){background:linear-gradient(180deg,#fff 50%,#EEFAD0)}
.gamecard .gicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blue);color:#fff}
.gamecard:nth-child(2) .gicon{background:#D63CBF}
.gamecard:nth-child(3) .gicon{background:#6A8F00}
.gamecard .gicon svg{width:22px;height:22px}
.gamecard .btn{margin-top:auto;align-self:flex-start}
.gamecard.done .gicon{background:var(--mint)}
.wordle{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0 18px}
.wrow{display:flex;gap:6px}
.tile{width:58px;height:58px;border-radius:12px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:1.5rem;color:var(--ink);text-transform:uppercase;transition:transform .2s}
.tile.filled{border-color:#9AA2B5;animation:bump .12s}
@keyframes bump{50%{transform:scale(1.08)}}
.tile.correct{background:var(--mint);border-color:var(--mint);color:#fff;animation:flip .5s}
.tile.present{background:#FFB547;border-color:#FFB547;color:var(--ink);animation:flip .5s}
.tile.absent{background:#7C8396;border-color:#7C8396;color:#fff;animation:flip .5s}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
.kbd{display:flex;flex-direction:column;gap:6px;align-items:center;max-width:540px;margin:0 auto}
.kbd div{display:flex;gap:5px;width:100%;justify-content:center}
.kbd button{flex:1;max-width:44px;min-height:52px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;transition:transform .08s}
.kbd button:active{transform:scale(.94)}
.kbd button.wide{max-width:78px;font-size:.8rem}
.kbd button.correct{background:var(--mint);color:#fff;border-color:var(--mint)}
.kbd button.present{background:#FFB547;border-color:#FFB547}
.kbd button.absent{background:#7C8396;color:#fff;border-color:#7C8396}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.quizopt{display:block;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:var(--r-ctl);padding:14px 16px;margin-bottom:10px;cursor:pointer;font-weight:500;transition:border-color .15s,background .15s}
.quizopt:hover{border-color:var(--blue)}
.quizopt.right{border-color:var(--mint);background:var(--mint-50)}
.quizopt.wrong{border-color:var(--red);background:var(--red-50)}
.quizopt[disabled]{cursor:default}
.explain{background:var(--blue-50);border-left:3px solid var(--blue);border-radius:10px;padding:14px 16px;margin:8px 0 14px}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
.matchbtn{display:block;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:var(--r-ctl);padding:14px;cursor:pointer;font-weight:500;margin-bottom:10px;transition:all .15s}
.matchbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-50);box-shadow:0 0 0 3px rgba(46,59,255,.12)}
.matchbtn.paired{border-color:var(--mint);background:var(--mint-50);cursor:default}
.matchbtn.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Messages */
.inbox{display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);min-height:540px;overflow:hidden;box-shadow:var(--shadow-sm)}
.threads{border-right:1px solid var(--line);overflow:auto}
.thread{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:14px 16px;cursor:pointer}
.thread:hover{background:var(--surface)}
.thread[aria-current="true"]{background:var(--blue-50);box-shadow:inset 3px 0 0 var(--blue)}
.thread b{display:block;font-weight:600}
.thread .sub{font-size:.86rem;color:var(--ink-2)}
.thread .unread{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;margin-right:6px}
.conv{display:flex;flex-direction:column}
.conv header{padding:16px 20px;border-bottom:1px solid var(--line)}
.conv .msgs{flex:1;padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:430px;background:#FBFBFD}
.msg{max-width:78%;background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;animation:pop .25s var(--ease)}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue);border-radius:16px 16px 4px 16px}
.msg .t{font-size:.72rem;opacity:.7;margin-top:4px}
.conv form{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
.conv form input{min-height:44px;border-radius:999px;padding-left:18px}

/* Pipeline */
.kanban{position:relative;display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r-card);padding:10px;min-height:320px;transition:background .2s,outline-color .2s}
.col h3{font-size:.88rem;display:flex;justify-content:space-between;margin:4px 4px 10px;font-weight:600}
.col h3 .muted{background:#fff;border-radius:999px;padding:0 8px;font-size:.78rem}
.col.over{outline:2px dashed var(--blue);outline-offset:-2px;background:var(--blue-50)}
.cand{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab;box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s}
.cand:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cand:active{cursor:grabbing}
.cand .nm{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.cand .nm b{line-height:1.2;font-weight:600}
.cand select{min-height:34px;padding:4px 10px;font-size:.84rem;margin-top:8px;border-radius:999px}
.cand .open{background:none;border:0;padding:0;color:var(--blue);font-weight:550;cursor:pointer;font-size:.88rem}
.cand .open:hover{text-decoration:underline}

/* Stepper */
.stepper{display:flex;gap:8px;margin-bottom:22px;list-style:none;padding:0;flex-wrap:wrap}
.stepper li{flex:1;min-width:120px;border-top:3px solid var(--line);padding-top:8px;font-size:.86rem;color:var(--muted)}
.stepper li.done{border-color:var(--blue);color:var(--ink-2)}
.stepper li.now{border-color:var(--blue);color:var(--ink);font-weight:600}
.preview-label{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.preview-frame{border:1px dashed var(--dash);border-radius:var(--r-panel);padding:18px;background:#FBFBFD}

/* Charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:13px}
.chart .val{fill:var(--ink);font-weight:600}
.bar-h{display:grid;grid-template-columns:160px 1fr 44px;gap:12px;align-items:center;margin-bottom:10px;font-size:.9rem}
.bar-h .b{height:14px;border-radius:5px;overflow:hidden;background:var(--hatch),var(--blue-50)}
.bar-h .b i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .9s var(--ease)}
.bar-h .n{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* Checklist */
.checklist{list-style:none;padding:0;margin:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.checklist li:last-child{border:0}
.checklist svg{width:19px;height:19px;flex:none;margin-top:2px;color:var(--muted)}
.ok svg{color:var(--mint)}
.bad svg{color:var(--red)}
.tabs{display:inline-flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;margin-bottom:18px;max-width:100%;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button{background:none;border:0;padding:8px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:999px}
.tabs button[aria-selected="true"]{color:var(--ink);background:#fff;box-shadow:var(--shadow-sm)}
.listitem{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.listitem:last-child{border-bottom:0}
.listitem .grow{flex:1;min-width:0}
.listitem .date{width:52px;height:56px;flex:none;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.listitem .date b{font-size:1.25rem;font-weight:600}
.listitem .date span{font-size:.72rem;color:var(--muted);margin-top:3px}

/* Mobile nav */
.mobnav{display:none}

/* ===== Global feature components ===== */
html.fs-1{font-size:112.5%} html.fs-2{font-size:125%}
html.a11y-spacing{--font:"Atkinson Hyperlegible","Geist",system-ui,sans-serif}
html.a11y-spacing body{letter-spacing:.03em;word-spacing:.14em;line-height:1.8}
html.a11y-contrast{--muted:#2B3043;--ink-2:#0F1222;--line:#8E96AA;--dash:#7E879C;--surface-2:#E2E5EC}
html.a11y-contrast .chip{border-color:#8E96AA}
html.a11y-motion *,html.a11y-motion *::before,html.a11y-motion *::after{animation:none!important;transition:none!important}
html.a11y-motion .hero h1 .w{opacity:1;transform:none}
kbd{font-family:var(--font);font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);background:#fff}
.pop{position:absolute;z-index:85;width:min(380px,calc(100vw - 24px));background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .2s var(--ease)}
.pop-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notif-list{list-style:none;margin:0;padding:6px;max-height:380px;overflow:auto}
.notif-list a{display:flex;gap:10px;padding:10px;border-radius:12px;text-decoration:none;color:var(--ink)}
.notif-list a:hover{background:var(--surface)}
.notif-list a.unread .nt{font-weight:600}
.notif-list .nt{display:block;line-height:1.35;font-size:.92rem}
.nd{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
.nd.off{background:transparent}
.ov-top{align-items:flex-start;padding-top:12vh}
.modal-palette{padding:0;width:min(640px,100%);overflow:hidden}
.pal-input{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal-input svg{width:20px;height:20px;color:var(--muted)}
.pal-input input{border:0;min-height:36px;padding:0;font-size:1.1rem;box-shadow:none!important}
#palres{max-height:420px;overflow:auto;padding:6px}
.pal-group{font-size:.78rem;color:var(--muted);padding:10px 12px 4px;font-weight:500}
.pal-item{display:flex;flex-direction:column;padding:9px 12px;border-radius:12px;text-decoration:none;color:var(--ink)}
.pal-item b{font-weight:550}
.pal-item[aria-selected="true"],.pal-item:hover{background:var(--blue-50)}
.switch{display:flex;gap:14px;align-items:flex-start;font-weight:400;padding:12px 0;border-top:1px dashed var(--line);cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{flex:none;width:44px;height:26px;border-radius:999px;background:#C3C9D6;position:relative;transition:background .2s;margin-top:2px}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.sw{background:var(--blue)}
.switch input:checked+.sw::after{transform:translateX(18px)}
.switch input:focus-visible+.sw{box-shadow:var(--focus)}
.switch b{font-weight:600}
.seg{border:0;padding:0;margin:0 0 16px}
.seg legend{font-weight:600;margin-bottom:8px}
.seg label{display:inline-flex;font-weight:500;margin:0 6px 6px 0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;background:#fff;transition:all .15s}
.seg input:checked+span{border-color:var(--blue);background:var(--blue);color:#fff}
.seg input:focus-visible+span{box-shadow:var(--focus)}
.page-enter{animation:enter .45s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:99}
#tour{position:fixed;inset:0;z-index:95}
.tour-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(15,18,34,.55);pointer-events:none;outline:2px solid #fff;outline-offset:2px;transition:opacity .25s,outline-color .25s}
.tour-hole.none{outline-color:transparent}
#tour .tour-card{transition:opacity .25s}
#tour.moving .tour-card{opacity:0;pointer-events:none}
#tour.moving .tour-hole{outline-color:transparent}
html.tour-lock{overflow:hidden;scrollbar-gutter:stable}
html.tour-lock .helpbtn{visibility:hidden}
.tour-card{position:fixed;width:min(380px,calc(100vw - 24px));background:var(--white);border-radius:20px;padding:20px;box-shadow:var(--shadow-lg)}
.tour-card h2{font-size:1.2rem;margin:4px 0 6px}
.tour-card p{color:var(--ink-2)}
.tour-btns{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tour-dots{display:flex;gap:5px;margin-bottom:14px}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}
.tour-dots i.on{background:var(--blue);width:20px;border-radius:999px}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,#F8F9FB 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.1s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ===== Feature components ===== */
.regionmap{margin:0}
.regionmap svg{width:100%;height:auto;display:block;max-height:580px;overflow:visible}
.regionmap .dot{fill:#C9CFDD}
.regionmap .town{cursor:pointer}
.regionmap .pin{fill:var(--blue);transition:transform .25s var(--ease);transform-box:fill-box;transform-origin:50% 100%}
.regionmap .pinring{fill:var(--blue);opacity:.15;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.35}100%{transform:scale(2.2);opacity:0}}
.regionmap .town:hover .pin,.regionmap .town:focus .pin{transform:scale(1.15)}
.regionmap .town:focus{outline:none}
.regionmap .town:focus-visible .callout{stroke:var(--blue);stroke-width:2}
.regionmap .callout{fill:#fff;stroke:#D5DAF5;stroke-width:1}
.regionmap .town:hover .callout{stroke:var(--blue)}
.regionmap .cnm{font:600 13px var(--font);fill:var(--ink)}
.regionmap .cct{font:400 11.5px var(--font);fill:var(--muted)}
.regionmap .lead{stroke:#9DA6BA;stroke-width:1;stroke-dasharray:2 2}
.regionmap .empty circle{fill:#8E97AB}
.regionmap .empty text{font:400 11.5px var(--font);fill:var(--muted)}
.regionmap .drop{opacity:0;animation:dropin .6s var(--ease) forwards}
@keyframes dropin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.viewtog{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.viewtog button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 12px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:999px;font-size:.88rem}
.viewtog button svg{width:15px;height:15px}
.viewtog button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.cmpbox{display:inline-flex;align-items:center;gap:6px;font-weight:400;margin:0;cursor:pointer;color:var(--ink-2)}
.cmpbox input{width:16px;height:16px;accent-color:var(--blue)}
.tray{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px -10px rgba(15,18,34,.5);animation:pop .25s var(--ease);max-width:calc(100vw - 24px)}
.tray .tray-names{opacity:.7;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .btn-quiet{color:#fff}
.tray .btn-quiet:hover{background:rgba(255,255,255,.12);color:#fff}
.table.cmp th[scope=row]{color:var(--muted);font-weight:500;white-space:nowrap}
.table.cmp thead th{vertical-align:bottom;font-size:.95rem}
.table.cmp td.best{background:var(--mint-50);font-weight:600;color:var(--mint-ink)}
.slotbox{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--pink-50);border-left:3px solid #D63CBF}
.slotbox.ok{background:var(--blue-50);border-left-color:var(--blue);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.okbox,.warnbox{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px}
.okbox{background:var(--mint-50);color:var(--mint-ink);border-left:3px solid var(--mint)}
.warnbox{background:var(--peach-50);color:var(--peach-ink);border-left:3px solid #F07B3F}
.okbox svg,.warnbox svg{width:20px;height:20px;flex:none;margin-top:2px}
.okbox b,.warnbox b{color:inherit}
.infobar{display:flex;gap:10px;align-items:center;background:var(--blue-50);color:var(--blue-600);padding:12px 16px;border-radius:14px;margin-bottom:16px;font-weight:500;border-left:3px solid var(--blue)}
.infobar svg{width:19px;height:19px;flex:none}
.pickgrid{display:flex;flex-wrap:wrap;gap:8px}
.pick{font-weight:400;margin:0}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;background:var(--white);transition:all .15s}
.pick input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.pick input:focus-visible+span{box-shadow:var(--focus)}
.done-hero{width:64px;height:64px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin-bottom:14px;animation:pop .4s var(--ease);box-shadow:0 12px 24px -10px rgba(31,164,99,.8)}
.done-hero svg{width:32px;height:32px;color:#fff;stroke-width:3}
.nextlist{padding-left:1.2em;margin:0 0 20px}
.nextlist li{margin-bottom:8px}
.placement-hero .ph-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.placement-hero .ph-top>div:not(.ph-stat){flex:1 1 240px}
.ring{width:96px;height:96px;flex:none}
.ring-bg{fill:none;stroke:var(--blue-50);stroke-width:9}
.ring-fg{fill:none;stroke:var(--blue);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:42px 42px;transition:stroke-dashoffset 1.2s var(--ease)}
.ring-n{font:700 16px var(--font);fill:var(--ink)}
.ring-s{font:400 11px var(--font);fill:var(--muted)}
.weeks{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.weeks span{font-size:.76rem;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.weeks span.done{background:var(--blue-50);color:var(--blue-600);border-color:var(--blue-100);font-weight:500}
.weeks span.now{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.ph-stat{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto}
.ph-stat b{font-size:2.2rem;font-weight:400;letter-spacing:-.04em;line-height:1}
.goals{list-style:none;padding:0;margin:0}
.goals li{padding:9px 0;border-bottom:1px dashed var(--line)}
.goals .done{text-decoration:line-through;color:var(--muted)}
.checkin{border-left:3px solid var(--blue);padding:4px 0 4px 14px;margin-bottom:16px}
.checkin p{margin:6px 0}
.reply{background:var(--surface);border-radius:12px;padding:10px 14px;margin-top:8px}
.reply p{margin:4px 0 0}
.seg.moods span,.seg.rating span{padding:7px 12px;font-size:.88rem}
.cert{background:linear-gradient(160deg,#fff 40%,#EEF0FF)}
.cert-ico{width:48px;height:48px;border-radius:14px;background:var(--blue);display:grid;place-items:center;margin-bottom:10px}
.cert-ico svg{width:24px;height:24px;color:#fff}
.achv{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.achv li{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);padding:9px 11px;border-radius:12px;border:1px dashed var(--dash)}
.achv li.got{color:var(--ink);background:var(--blue-50);border:1px solid var(--blue-100);font-weight:500}
.ach-ico svg{width:17px;height:17px;display:block}
.achv li.got .ach-ico svg{color:var(--blue)}
.board{list-style:none;padding:0;margin:0}
.board li{display:grid;grid-template-columns:28px 1fr auto 52px;gap:10px;align-items:center;padding:8px 10px;border-radius:12px}
.board li:nth-child(-n+3) .pos{background:var(--ink);color:#fff}
.board .pos{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:.82rem}
.board .pts{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.board li.me{background:var(--blue-50);box-shadow:inset 0 0 0 1px var(--blue-100)}
.company-hero{display:flex;gap:20px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);padding:28px;margin-bottom:16px;position:relative;overflow:hidden;isolation:isolate}
.company-hero::before{content:"";position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.18;z-index:-1}
.company-hero h1{font-size:2rem;margin-bottom:8px}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:15px;height:15px;color:#C3C9D6;fill:#E7EAF0}
.stars .on svg{color:#E8A21F;fill:#FFC24D}
.review{margin:14px 0 0;padding:14px;border-radius:14px;background:var(--surface)}
.review p{margin:6px 0}
.rate{display:inline-flex;gap:2px}
.rate button{background:none;border:0;padding:3px;cursor:pointer;border-radius:6px}
.rate svg{width:22px;height:22px;color:#AEB5C5;fill:transparent;transition:transform .15s}
.rate button.on svg{color:#E8A21F;fill:#FFC24D}
.rate button:hover svg{transform:scale(1.15)}
.minirate{margin-top:4px}
.minirate .stars svg{width:12px;height:12px}
.fun{margin-bottom:14px}
.fun-top{display:flex;justify-content:space-between;margin-bottom:4px;font-size:.92rem}
.fun .b{height:12px;border-radius:5px;overflow:hidden;background:var(--hatch),var(--blue-50)}
.fun .b i{display:block;height:100%;background:var(--blue);border-radius:5px}
.funnel{display:flex;flex-direction:column;gap:8px}
.fn-row{display:grid;grid-template-columns:220px 1fr 150px;gap:12px;align-items:center}
.fn-bar{position:relative;height:36px;border-radius:10px;background:var(--hatch),var(--blue-50)}
.fn-bar i{display:block;height:100%;background:linear-gradient(90deg,#2E3BFF,#5A6BFF);border-radius:10px;transition:width .9s var(--ease)}
.fn-bar span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#fff;font-weight:600}
.fn-row:last-child .fn-bar span{color:var(--ink);left:auto;right:12px}
.chart .grow{transform-box:fill-box;transform-origin:bottom;animation:growy .8s var(--ease) both}
@keyframes growy{from{transform:scaleY(0)}}
.drawline{stroke-dasharray:2000;stroke-dashoffset:0;animation:draw 1.4s var(--ease)}
@keyframes draw{from{stroke-dashoffset:2000}}
.callout-ins{background:#F6F7FF;border-left:3px solid var(--blue);border-radius:10px;padding:10px 14px;font-size:.88rem;color:var(--ink-2);margin-top:12px}

@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr);background:var(--surface)}
  .side{display:none}
  .mobnav{display:flex;position:sticky;top:40px;z-index:40;background:var(--white);border-bottom:1px solid var(--line);overflow-x:auto;gap:4px;padding:8px 10px;align-items:center}
  .mobnav .brand{margin-right:6px}
  .mobnav .brand .wm,.mobnav .concept-tag{display:none}
  .mobnav a{white-space:nowrap;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:.9rem}
  .mobnav a[aria-current="page"]{background:var(--blue);color:#fff}
  .topbar{padding:12px 18px 0}
  .topbar .searchtrigger{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:var(--muted);cursor:pointer}
  .topbar .searchtrigger svg{width:16px;height:16px}
  .topbar .today{display:none}
  .main{padding:18px 18px 72px}
  .grid-main,.cvgrid{grid-template-columns:minmax(0,1fr)}
  .cvpaper,.applybox{position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:minmax(0,1fr)}
  .filters{position:static}
  .hero .inner{grid-template-columns:1fr;padding-top:110px}
  .hero-cards{height:300px}
  .employer-band .section{grid-template-columns:1fr}
  .sectors{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr;gap:16px}
}
@media (max-width:720px){
  .demobar{position:relative;padding:6px 10px;gap:8px}
  .demobar .note,.demobar .roles span{display:none}
  .demobar .roles{margin-left:0}
  .demobar button{padding:2px 9px;font-size:.78rem}
  .mobnav{top:0}
  .side,.applybox,.filters{top:0}
  .pub-header .actions .btn-primary{display:none}
  .pub-header .inner{padding:12px 16px}
  .pub-nav{display:none}
  .brand small{display:none}
  .hero .inner{padding:96px 18px 28px}
  .hero .frame{display:none}
  .hero-cards{display:none}
  .hero-foot{padding:0 18px 28px}
  .searchbar{flex-direction:column;border-radius:20px}
  .searchbar select{max-width:none;border-left:0;border-top:1px solid var(--line)}
  .searchbar .btn{border-radius:14px}
  .hero-sectors{display:none}
  .section{padding:48px 18px}
  .steps,.statgrid{grid-template-columns:1fr}
  .grid-2,.grid-3,.gamecards{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div:nth-child(3n){border-right:1px dashed var(--dash)}
  .facts div:nth-child(2n){border-right:0}
  .jobrow{grid-template-columns:44px minmax(0,1fr)}
  .jobrow .jside{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .logo{width:44px;height:44px;font-size:.82rem}
  .inbox{grid-template-columns:1fr}
  .threads{border-right:0;border-bottom:1px solid var(--line);max-height:220px}
  .tile{width:50px;height:50px;font-size:1.25rem}
  .nextstep{flex-direction:column;align-items:flex-start}
  .nextstep .btn{margin-left:0}
  .row{flex-direction:column;gap:0}
  .matchgrid{grid-template-columns:1fr}
  .jobhead h1{font-size:1.7rem}
  .bar-h{grid-template-columns:110px 1fr 34px}
  .fn-row{grid-template-columns:1fr;gap:4px}
  .achv{grid-template-columns:1fr}
  .company-hero{flex-direction:column;align-items:flex-start}
  .tray .tray-names{display:none}
  .ph-stat{align-items:flex-start;margin-left:0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}

}

  body.print-cv *{visibility:hidden}
  body.print-cv #cv-preview,body.print-cv #cv-preview *{visibility:visible}
  body.print-cv #cv-preview{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none}
}

/* ===== Round 3 ===== */
.hero-sm .inner{padding-top:120px}
.hero-sm h1{font-size:clamp(2.4rem,5vw,4.2rem);max-width:18ch}
.fixgrid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px dashed var(--dash);border-left:1px dashed var(--dash)}
.fix{display:grid;grid-template-columns:56px 1fr;gap:6px 14px;padding:22px;border-right:1px dashed var(--dash);border-bottom:1px dashed var(--dash);background:var(--white);align-content:start}
.fix-n{grid-row:span 3;font-size:2rem;font-weight:300;letter-spacing:-.04em;color:var(--blue);line-height:1}
.fix p{margin:2px 0 0}
.fix-was p{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(217,54,43,.45)}
.fix .btn{justify-self:start;margin-top:6px}
.featurecard{text-decoration:none;color:var(--ink);transition:transform .25s var(--ease),box-shadow .25s}
.featurecard:hover{transform:translateY(-3px);box-shadow:var(--shadow);color:var(--ink)}
.fc-ic{width:44px;height:44px;border-radius:12px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;margin-bottom:12px}
.fc-ic.sm{width:36px;height:36px;margin:0}
.fc-ic svg{width:21px;height:21px}
.matchpanel{margin-bottom:24px}
.mp-top{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.mp-top .ring{width:84px;height:84px}
.practice .pr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pr-timer{display:flex;align-items:center;gap:10px}
#pr-time{font-size:1.6rem;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:64px;text-align:right}
#pr-time.over{color:var(--red)}
.pr-q{font-size:1.45rem;font-weight:500;letter-spacing:-.025em;line-height:1.25}
.star{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.certificate{border:1px solid var(--line);border-radius:16px;padding:34px;background:linear-gradient(160deg,#fff 50%,#EEF0FF);position:relative;overflow:hidden}
.certificate::after{content:"";position:absolute;right:-90px;bottom:-90px;width:260px;height:260px;border-radius:50%;border:30px solid rgba(46,59,255,.07)}
.cert-top{display:flex;justify-content:space-between;align-items:center}
.cert-name{font-size:2.6rem;font-weight:300;letter-spacing:-.04em;line-height:1.1;margin-bottom:12px}
.cert-badges{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 28px}
.cert-sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px dashed var(--dash);padding-top:16px}
.cert-sign .sig{font-family:"Brush Script MT","Segoe Script",cursive;font-size:1.6rem;color:var(--ink-2)}
.alertform,.rulesform{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.alertform .field,.rulesform .field{margin:0}
.rulesform{grid-template-columns:1fr 1fr}
.rulesform .btn{justify-self:start}
.cal{padding:0;overflow:hidden}
.cal-grid{display:grid;grid-template-columns:64px repeat(5,minmax(120px,1fr));overflow-x:auto;position:relative}
.cal-times{position:relative;margin-top:58px;border-right:1px solid var(--line)}
.cal-times span{position:absolute;right:10px;font-size:.75rem;color:var(--muted);transform:translateY(-50%)}
.cal-day{border-right:1px dashed var(--line);min-width:120px}
.cal-day:last-child{border-right:0}
.cal-h{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.cal-h b{font-size:1.15rem;font-weight:600}
.cal-body{position:relative;background-image:repeating-linear-gradient(180deg,transparent 0 51px,var(--line) 51px 52px)}
.cal-ev{position:absolute;left:6px;right:6px;border:0;border-radius:10px;padding:6px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;overflow:hidden;font-size:.78rem;line-height:1.25;transition:transform .2s var(--ease),box-shadow .2s}
.cal-ev:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.cal-ev b{font-size:.84rem}
.cal-ev.k-b{background:var(--blue);color:#fff}
.cal-ev.k-o{background:repeating-linear-gradient(135deg,var(--blue-50) 0 6px,#fff 6px 12px);color:var(--blue-600);box-shadow:inset 0 0 0 1px var(--blue-100)}
.cal-ev.k-t{background:var(--lime-50);color:var(--lime-ink)}
.cal-ev.k-p{background:#F7A8EE;color:#5b1d52}
.lg-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg-dot.hatch{background:repeating-linear-gradient(135deg,var(--blue-100) 0 2px,#fff 2px 4px);box-shadow:inset 0 0 0 1px var(--blue-100)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(31,164,99,.5);animation:livepulse 1.8s infinite}
@keyframes livepulse{70%{box-shadow:0 0 0 8px rgba(31,164,99,0)}100%{box-shadow:0 0 0 0 rgba(31,164,99,0)}}
.feed{list-style:none;padding:0;margin:0}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.feed li:last-child{border:0}
.feed li.fresh{animation:feedin .6s var(--ease)}
@keyframes feedin{from{opacity:0;transform:translateY(-8px);background:var(--blue-50)}}
.gantt{position:relative;padding-top:26px}
.g-months{position:absolute;top:0;left:130px;right:0;height:20px}
.g-months span{position:absolute;font-size:.75rem;color:var(--muted);border-left:1px dashed var(--line);padding-left:6px;height:calc(100% + 170px)}
.g-row{display:grid;grid-template-columns:130px 1fr;align-items:center;height:40px}
.g-l{font-size:.9rem;font-weight:500}
.g-track{position:relative;height:22px}
.g-bar{position:absolute;top:0;bottom:0;border-radius:8px;animation:barin .9s var(--ease) both}
@keyframes barin{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.g-bar.g0{background:var(--blue)}
.g-bar.g1{background:#F7A8EE}
.g-bar.g2{background:var(--violet)}
.g-bar.g3{background:var(--hatch),var(--blue-50);box-shadow:inset 0 0 0 1px var(--blue-100)}
.g-today{position:absolute;top:20px;bottom:0;width:0;border-left:2px solid var(--red)}
.g-today span{position:absolute;top:-22px;left:-20px;font-size:.72rem;font-weight:600;color:var(--red);background:var(--white);padding:0 4px}
.rowlink{font-weight:600;color:var(--ink);text-decoration:none}
.rowlink:hover{color:var(--blue);text-decoration:underline}
.helpbtn{position:fixed;right:20px;bottom:20px;z-index:65;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 18px 11px 14px;font-weight:550;cursor:pointer;box-shadow:0 14px 30px -10px rgba(15,18,34,.5);transition:transform .2s var(--ease)}
.helpbtn:hover{transform:translateY(-2px)}
.helpbtn svg{width:19px;height:19px}
.faq details{border-bottom:1px dashed var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:550;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";font-weight:300;font-size:1.3rem;line-height:1;color:var(--blue);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:8px 0 0;color:var(--ink-2)}
@media (max-width:1080px){.fixgrid{grid-template-columns:1fr}}
@media (max-width:720px){
  .star,.alertform,.rulesform{grid-template-columns:1fr}
  .helpbtn span{display:none}
  .helpbtn{padding:12px}
  .cert-sign{grid-template-columns:1fr}
  .cert-name{font-size:1.9rem}
  .g-row{grid-template-columns:90px 1fr}
  .g-months{left:90px}
  .g-today{display:none}
}

/* ===== Dark mode ===== */

/* panels that used inline styles */
.boostpanel{background:linear-gradient(165deg,#fff 35%,#FCE4F8);border-color:#F6D3EF}
.boostpanel .streak{background:#fff}
.draftpanel{background:linear-gradient(160deg,#fff 30%,var(--blue-50));border-color:var(--blue-100)}
.charttip{position:absolute;pointer-events:none;background:#0F1222;color:#fff;font-size:.85rem;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}

html.dark{--ink:#ECEEF6;--ink-2:#C9CDDB;--muted:#9AA1B5;--white:#151826;--surface:#0D0F19;--surface-2:#1C2033;--line:#262B40;--dash:#343A54;--blue-50:#1A1F4A;--blue-100:#2A3270;--blue-600:#AEB6FF;--link:#8E99FF;
  --mint-50:#10301F;--mint-ink:#7BE0A8;--honey-50:#33260E;--honey-ink:#FFCB7A;--red-50:#3A1714;--pink-50:#3A1534;--pink-ink:#F7A8EE;--lime-50:#22300C;--lime-ink:#C7EE74;--peach-50:#3A2213;--peach-ink:#FFB38A;--lav-50:#1F1D4A;
  --hatch:repeating-linear-gradient(135deg,rgba(142,153,255,.22) 0 2px,transparent 2px 7px);color-scheme:dark}
html.dark body{background:var(--surface)}
html.dark .btn-ghost,html.dark .tb-btn,html.dark .side-search,html.dark kbd,html.dark .chip,html.dark .seg span,html.dark .pick span,html.dark .quizopt,html.dark .matchbtn,html.dark .kbd button,html.dark .tile,html.dark .listitem .date,html.dark .cvexp,html.dark .preview-frame,html.dark .conv .msgs,html.dark .msg,html.dark .empty,html.dark .reply,html.dark .review,html.dark .tabs button[aria-selected="true"],html.dark .viewtog button[aria-pressed="true"],html.dark .col h3 .muted,html.dark .streak{background:var(--white);color:var(--ink)}
html.dark .btn-ghost{border-color:var(--line)}
html.dark .btn-honey{background:var(--ink);color:#0D0F19}
html.dark .btn-dark{background:#000}
html.dark input[type=text],html.dark input[type=search],html.dark input[type=email],html.dark input[type=number],html.dark input[type=date],html.dark input[type=datetime-local],html.dark select,html.dark textarea{background:#0F1220;border-color:var(--dash);color:var(--ink)}
html.dark .table tbody tr:hover{background:#191D2E}
html.dark .cvpaper{background:#fff;color:#0F1222}
html.dark .cvpaper h2,html.dark .cvpaper *{color:#0F1222}
html.dark .gamecard,html.dark .steps li,html.dark .cert,html.dark .certificate,html.dark .pub-header,html.dark .marquee,html.dark .pub-footer,html.dark .sector,html.dark .fix{background:var(--white)}
html.dark .marquee::before{background:linear-gradient(90deg,var(--white),transparent)}
html.dark .marquee::after{background:linear-gradient(-90deg,var(--white),transparent)}
html.dark .pub-header.on-blue{background:transparent}
html.dark .shell{background:linear-gradient(to right,var(--white) 259px,var(--line) 259px,var(--line) 260px,var(--surface) 260px)}
html.dark .regionmap .dot{fill:#2C3352}
html.dark .regionmap .callout{fill:var(--white);stroke:var(--dash)}
html.dark .chart text{fill:var(--muted)}
html.dark .fcard{background:#fff;color:#0F1222}
html.dark .fcard .chip{background:#F4F5F8;color:#30354A;border-color:#E4E6ED}
html.dark .pub-footer .huge{color:#1C2033}
html.dark .avatar{color:#0F1222}
html.dark .tour-card,html.dark .modal,html.dark .drawer,html.dark .pop{background:var(--white)}
html.dark .toast{background:#ECEEF6;color:#0F1222}
html.dark .helpbtn{background:#ECEEF6;color:#0F1222}
html.dark .tray{background:#ECEEF6;color:#0F1222}
html.dark .tray .btn-quiet{color:#0F1222}
html.dark .g-today span{background:var(--white)}
html.dark .callout-ins{background:var(--blue-50)}
html.dark .cal-ev.k-o{background:repeating-linear-gradient(135deg,var(--blue-50) 0 6px,var(--white) 6px 12px)}
html.dark .board li:nth-child(-n+3) .pos{background:var(--ink);color:#0D0F19}
html.dark .demobar button[aria-pressed="true"]{background:#fff;color:#0F1222}

.cal-day.today .cal-h b{background:var(--blue);color:#fff;border-radius:999px;padding:0 9px}

html.dark .demobar{background:#05060C;color:#E3E6F2}
html.dark .boostpanel{background:linear-gradient(165deg,var(--white) 40%,#3A1838);border-color:#4A2547}
html.dark .boostpanel .streak{background:var(--surface-2)}
html.dark .draftpanel{background:linear-gradient(160deg,var(--white) 35%,#1D2358);border-color:var(--blue-100)}
html.dark .hero .ctas .btn-primary,html.dark .pub-header.on-blue .btn-primary{background:#fff;color:#0F1222}
html.dark .hero .ctas .btn-primary:hover{background:#EEF0FF}
html.dark .hero .ctas .btn-dark{background:#05060C;color:#fff}
html.dark .searchbar{background:var(--white);color:var(--ink);box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
html.dark .searchbar input,html.dark .searchbar select{background:transparent;border-color:var(--line)}
html.dark .charttip{background:#ECEEF6;color:#0F1222}
html.dark .btn-honey{background:#ECEEF6;color:#0F1222}
html.dark .facts{background:var(--white)}
html.dark .tb-btn:hover{background:var(--surface-2)}
html.dark .topbar .searchtrigger{background:var(--white)}
html.dark .cvpaper .chip{background:#F4F5F8;border-color:#E4E6ED;color:#0F1222}
html.dark .cvpaper .chip svg{color:var(--blue)}

/* ===== Daily Career Boost: hub ===== */
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.newtag{position:absolute;top:16px;right:16px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ink);color:var(--white)}
.newtag.inline{position:static;display:inline-block;vertical-align:2px;margin-left:4px;font-size:.66rem;padding:1px 7px}
.gamelib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.gametile{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--white);color:var(--ink);text-decoration:none;transition:border-color .15s,transform .2s var(--ease)}
.gametile:hover{border-color:var(--blue);transform:translateY(-2px)}
.gametile .gicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--blue-50);color:var(--blue);flex:none}
.gametile .gicon svg{width:20px;height:20px}
.gametile .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.gametile.done .gicon{background:var(--mint-50);color:var(--mint-ink)}
.gametile .gt-meta{font-weight:600;white-space:nowrap;color:var(--ink-2)}
.tomorrow{display:flex;align-items:center;gap:8px;margin:14px 0 0}
.tomorrow svg{width:16px;height:16px}
.streakcal{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.sday{display:flex;flex-direction:column;align-items:center;gap:4px}
.sday i{width:100%;max-width:30px;aspect-ratio:1;border-radius:9px;background:var(--surface-2);border:1px dashed var(--dash);display:grid;place-items:center;color:#fff}
.sday i svg{width:14px;height:14px}
.sday.on i{background:linear-gradient(140deg,#FF8A3D,#FF4D6D);border:0}
.sday.today i{outline:2px solid var(--blue);outline-offset:2px}
.sday .small{font-size:.68rem}
.minigames{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.minigames a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--white);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.minigames a:hover{border-color:var(--blue)}
.minigames .gicon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--blue);color:#fff}
.minigames .gicon svg{width:15px;height:15px}
.minigames a.done{color:var(--muted)}
.minigames a.done .gicon{background:var(--mint)}

/* ===== Word Hive ===== */
.hive-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.hive-play{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
.hive-rank{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.rankdots{display:flex;align-items:center;gap:0}
.rankdots i{width:10px;height:10px;border-radius:50%;background:var(--surface-2);border:1px solid var(--dash);margin-right:14px;position:relative}
.rankdots i:not(:last-child)::after{content:"";position:absolute;left:10px;top:3px;width:14px;height:2px;background:var(--line)}
.rankdots i.on{background:var(--blue);border-color:var(--blue)}
.rankdots i.now{width:14px;height:14px;box-shadow:0 0 0 4px var(--blue-50)}
.hive-input{min-height:52px;font-size:2rem;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--line);min-width:260px;padding:0 10px}
.hive-input .cen{color:var(--blue)}
.hive-input .bad{color:var(--muted);text-decoration:line-through}
.hive-input .ph{font-size:1rem;font-weight:400;color:var(--muted);letter-spacing:0}
.hive-input.shake{animation:shake .3s}
.hive-input.good{animation:bump .25s}
.hive-input.pangram{animation:bump .4s}
.hive{position:relative;width:240px;height:252px}
.hcell{position:absolute;width:88px;height:80px;padding:0;border:0;background:none;cursor:pointer;border-radius:16px}
.hcell .hexshape{display:grid;place-items:center;width:100%;height:100%;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#DCE0EB;color:var(--ink);font-size:1.6rem;font-weight:700;transition:transform .1s,background .15s}
.hcell:hover .hexshape{background:var(--blue-100)}
.hcell:active .hexshape{transform:scale(.92)}
.hcell.centre .hexshape{background:var(--blue);color:#fff}
.hcell.centre:hover .hexshape{background:var(--blue-600)}
.hcell:focus-visible{outline:none}
.hcell:focus-visible .hexshape{box-shadow:inset 0 0 0 4px var(--ink)}
.hcell:disabled{cursor:default;opacity:.7}

.conn-tile:active{transform:scale(.96)}
.conn-tile.sel{background:var(--ink);color:var(--white);border-color:var(--ink)}

.conn-solved{min-height:76px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;color:#0F1222;animation:pop .35s var(--ease)}

.conn-mistakes{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 12px}
